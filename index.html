    const unsaved = S.queue.filter(function(q) { return !q.saved; }).length;
    let h = '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;">' +
      '<div style="font-size:14px; font-weight:900;">⚡ 스캔 채점함 (' + S.queue.length + '건)</div>' +
      '<div style="display:flex; gap:5px;">' +
        (unsaved ? '<button type="button" class="btn em sm" onclick="saveAllUnsaved_()">💾 미저장 ' + unsaved + '건 일괄저장</button>' : '') +
        (S.queue.length ? '<button type="button" class="btn sm" onclick="clearQ_()">목록 비우기</button>' : '') +
      '</div>' +
    '</div>';

    if (!S.queue.length) {
      h += '<div style="padding:28px 12px; text-align:center; color:#94a3b8; font-size:12.5px; line-height:1.6;">왼쪽에서 <strong>[▶ 실시간 카메라 켜기]</strong>를 누르고 OMR을 비추면<br>자동으로 채점되어 <strong>전자 내신출석부</strong>까지 즉시 저장됩니다.</div>';
    } else {
      h += '<div class="q-list">';
      S.queue.forEach(function(q) {
        const rgs = (Array.isArray(q.ranges) && q.ranges.length) ? q.ranges : [[q.fromNo, q.toNo]];
        const g = q.isWrongRetest ? gradeWrongSetLocal_(q.wrongSetId, q.answers, rgs) : gradeLocal_(q.secKey, q.answers, rgs);
        q.graded = g;
        const hasPend = (Array.isArray(q.subjPendingNos) && q.subjPendingNos.length > 0) || g.ungradedSubj > 0;
        const qDenom = (g.ungradedSubj > 0 && (g.solved + g.ungradedSubj) >= g.rangeCount) ? g.rangeCount : g.solved;
        const stTxt = q.saving ? '☁️ 저장 중...' : (q.qrMissing ? '⚠️ QR미인식·미저장' : (hasPend ? ('✍️ 서술형 ' + Math.max(g.ungradedSubj, (q.subjPendingNos || []).length) + '문항 미채점') : (q.saved ? (q.isWrongRetest ? '✓ 오답해결 반영' : '✓ 출석부 저장됨') : '● 미저장')));
        const stClr = q.qrMissing ? '#f87171' : (hasPend ? '#a5b4fc' : (q.saved ? '#34d399' : '#fbbf24'));
        h += '<div class="q-item ' + (act && act.id === q.id ? 'sel ' : '') + (q.saved ? 'saved' : 'unsaved') + '" onclick="selQ_(\'' + esc_(q.id) + '\')">' +
          '<div><div style="font-size:13px; font-weight:800; color:' + (q.isWrongRetest ? '#c4b5fd' : '#f8fafc') + ';">' + esc_(q.name) + ' <span style="font-size:11px; color:#94a3b8;">' + esc_(q.naesinBan) + '</span></div>' +
          '<div style="font-size:11px; color:#94a3b8;">' + esc_(q.secTitle) + ' · ' + esc_(formatRanges_(rgs)) + '번</div></div>' +
          '<div style="display:flex; align-items:center; gap:7px;">' +
            '<div style="text-align:right;"><div style="font-size:13.5px; font-weight:900; color:' + (g.acc >= 80 ? '#34d399' : '#fbbf24') + ';">' + (q.isWrongRetest ? '해결 ' : '') + g.correct + '/' + qDenom + (g.ungradedSubj > 0 ? ' (서술형대기)' : (' (' + g.acc + '%)')) + '</div>' +
            '<div style="font-size:10.5px; color:' + stClr + ';">' + stTxt + '</div></div>' +
            '<button type="button" class="btn sm" style="padding:4px 7px; background:rgba(220,38,38,0.28); border-color:rgba(248,113,113,0.45); color:#fecaca;" title="저장된 기록 및 출석부 진도 삭제" onclick="event.stopPropagation(); deleteItem_(\'' + esc_(q.id) + '\')">🗑️</button>' +
          '</div>' +
        '</div>';
      });
      h += '</div>';
    }

    if (act) {
      const actRgs = (Array.isArray(act.ranges) && act.ranges.length) ? act.ranges : [[act.fromNo, act.toNo]];
      const g = act.isWrongRetest ? gradeWrongSetLocal_(act.wrongSetId, act.answers, actRgs) : gradeLocal_(act.secKey, act.answers, actRgs);
      const rngTxt = formatRanges_(actRgs);
      const secMaxN = (act.isWrongRetest ? getWrongSetVirtualItems_(act.wrongSetId).length : (S.itemsBySec[act.secKey] || []).length) || act.toNo || 20;
      h += '<div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line);">' +
        (act.qrMissing ? '<div style="margin-bottom:8px; padding:8px 10px; border-radius:9px; background:rgba(239,68,68,0.18); border:1px solid rgba(248,113,113,0.45); font-size:11.5px; font-weight:800; color:#fecaca;">⚠️ QR 코드가 읽히지 않아 오저장을 자동 차단했습니다. 아래에서 학생·교재를 직접 고른 뒤 [💾 저장]하거나 다시 스캔해 주세요.</div>' : (act.isWrongRetest ? '<div style="margin-bottom:8px; padding:8px 10px; border-radius:9px; background:rgba(124,58,237,0.22); border:1px solid rgba(196,181,253,0.45); font-size:11.5px; font-weight:800; color:#ede9fe;">🎯 오답 재채점 모드 — 맞춘 문항은 원래 교재 파트에서 자동 해결되며, 남은 오답만 다음 오답노트에 포함됩니다.</div>' : '')) +
        '<div style="display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; margin-bottom:8px;">' +
          '<div><div style="font-size:13.5px; font-weight:900;">🔍 ' + esc_(act.name) + ' · ' + esc_(rngTxt) + '번</div>' +
          '<div style="font-size:11.5px; color:#cbd5e1; margin-top:2px;">' + (act.isWrongRetest ? '해결 ' : '맞음 ') + '<strong style="color:#34d399;">' + g.correct + '</strong> · ' + (act.isWrongRetest ? '재오답 ' : '틀림 ') + '<strong style="color:#f87171;">' + g.wrong + '</strong> · 채점 ' + g.solved + '/' + g.rangeCount + (g.subjTotal > 0 ? (' (객' + (g.rangeCount - g.subjTotal) + '+서' + g.subjTotal + ')') : '') + (g.ungradedSubj > 0 ? (' · <strong style="color:#fbbf24;">⚠️서술형 ' + g.ungradedSubj + ' 미채점</strong>') : (' · 정답률 <strong style="color:#38bdf8;">' + g.acc + '%</strong>')) + '</div></div>' +
          '<div style="display:flex; gap:5px; align-items:center; flex-wrap:wrap;">' +
            '<select class="sel" style="height:28px; max-width:130px;" onchange="reassignStu_(\'' + esc_(act.id) + '\', this.value)">' +
              '<option value="">-- 학생 선택 --</option>' +
              S.students.map(function(s) { return '<option value="' + esc_(s.erpId) + '"' + (s.erpId === act.erpId ? ' selected' : '') + '>[' + esc_(s.naesinBan) + '] ' + esc_(s.name) + '</option>'; }).join("") +
            '</select>' +
            (!act.isWrongRetest ? ('<select class="sel" style="height:28px; max-width:165px;" onchange="reassignSec_(\'' + esc_(act.id) + '\', this.value)">' +
              S.sections.concat(S.prepSections || []).map(function(sec) { return '<option value="' + esc_(sec.key) + '"' + (sec.key === act.secKey ? ' selected' : '') + '>' + esc_(sec.title) + '</option>'; }).join("") +
            '</select>') : '') +
            '<button type="button" class="btn em sm" onclick="saveItem_(\'' + esc_(act.id) + '\', false)">' + (act.isWrongRetest ? '💾 오답해결 반영' : '💾 저장') + '</button>' +
            '<button type="button" class="btn sm" style="background:rgba(220,38,38,0.28); border-color:rgba(248,113,113,0.5); color:#fecaca;" onclick="deleteItem_(\'' + esc_(act.id) + '\')">🗑️ 삭제</button>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; padding:7px 9px; border-radius:9px; background:rgba(124,58,237,0.16); border:1px solid rgba(167,139,250,0.35); margin-bottom:8px; font-size:11.5px; font-weight:800;">' +
          '<span style="display:inline-flex; align-items:center; gap:5px; flex-wrap:wrap;">🎯 구간: <input type="text" class="rng-inp" style="width:142px; text-align:left; padding:0 7px;" value="' + esc_(rngTxt) + '" placeholder="예: 1~24, 30~35, 47~" onchange="setQRangesText_(\'' + esc_(act.id) + '\', this.value)">' + (act.rangeMarked ? '<span style="color:#c4b5fd; font-size:10.5px;">✓ 구간체크</span>' : '') + '</span>' +
          '<div style="display:flex; gap:4px; flex-wrap:wrap;">' +
            '<button type="button" class="btn pri sm" onclick="snapMarkedOnly_(\'' + esc_(act.id) + '\')">✨ 마킹만 보기</button>' +
            '<button type="button" class="btn sm" onclick="resetAllRange_(\'' + esc_(act.id) + '\')">전체(1~' + secMaxN + ')</button>' +
            '<button type="button" class="btn sm" style="background:rgba(239,68,68,0.22); border-color:rgba(248,113,113,0.45);" onclick="markBlanksX_(\'' + esc_(act.id) + '\')">빈칸→X</button>' +
          '</div>' +
        '</div>' +
        (act.previewUrl ? '<details style="margin-bottom:8px;"><summary style="cursor:pointer; font-size:11.5px; font-weight:800; color:#7dd3fc;">🖼️ 원근보정 OMR 오버레이 보기</summary><img src="' + act.previewUrl + '" style="width:100%; max-width:280px; border-radius:8px; margin-top:6px; display:block;"></details>' : '');

      const subjList = g.perItem.filter(function(pi) { return pi.t === "subj"; });
      if (subjList.length > 0) {
        const hasCrop = subjList.some(function(pi) { return Boolean(act.subjCrops && act.subjCrops[String(pi.n)]); });
        h += '<div class="subj-bar">' +
          '<div style="flex:1; min-width:0;">' +
            '<div style="font-weight:900;">✍️ 서술형 단답 채점 (' + subjList.length + '문항)</div>' +
            '<div id="subjOcrTxt_' + esc_(act.id) + '" style="font-size:11px; color:#c7d2fe; margin-top:2px;">' + esc_(act.ocrMsg || "필기 이미지를 보고 단답 입력(자동 동치채점) 또는 O/X를 탭한 뒤 [💾 저장]하세요.") + '</div>' +
          '</div>' +
          (hasCrop ? '<button type="button" class="btn pri sm" onclick="runSubjOcr_(\'' + esc_(act.id) + '\')"' + (act.ocrBusy ? ' disabled' : '') + '>🔍 필기 숫자 OCR</button>' : '') +
        '</div>';
      }

      const renderRow_ = function(pi) {
        if (pi.t === "subj") {
          const isPend = Array.isArray(act.subjPendingNos) && act.subjPendingNos.indexOf(pi.n) !== -1 && !pi.stu;
          const rCls = pi.status === "ok" ? " ok" : (pi.status === "bad" ? " bad" : (isPend ? " pend" : ""));
          const cropUrl = (act.subjCrops && act.subjCrops[String(pi.n)]) || "";
          const corLbl = String(pi.disp || pi.cor || "").trim();
          const opts = pi.stu === "△" ? ["O","△","X"] : ["O","X"];
          let rh = '<div class="ans-row subj-row' + rCls + '">' +
            '<div class="subj-top">' +
              '<span style="display:inline-flex; align-items:center; gap:5px; min-width:0; flex:1;">' +
                '<span class="ans-no">' + pi.n + '.</span>' +
                '<span style="font-size:11px; font-weight:800; color:#a5b4fc;">서술형</span>' +
                (pi.origLbl ? '<span style="font-size:10px; font-weight:700; color:#c4b5fd;">' + esc_(pi.origLbl) + '</span>' : '') +
              '</span>' +
              '<span style="display:inline-flex; gap:4px;">';
          opts.forEach(function(o) {
            const picked = pi.stu === o;
            let cls = "bub";
            if (picked) cls += " picked " + (o === "O" ? "ok" : "bad");
            rh += '<button type="button" class="' + cls + '" onclick="toggleAns_(\'' + esc_(act.id) + '\',' + pi.n + ',\'' + o + '\',\'subj\')">' + o + '</button>';
          });
          rh += '</span></div>';
          if (corLbl) rh += '<div class="subj-cor">정답: ' + esc_(corLbl) + '</div>';
          if (cropUrl) rh += '<div class="subj-crop-wrap"><img class="subj-crop" src="' + cropUrl + '" onclick="this.classList.toggle(\'exp\')" title="탭하여 확대/축소"></div>';
          rh += '<input type="text" class="subj-inp" value="' + esc_(pi.stuText || "") + '" placeholder="학생 단답 입력(예: 12, 10/3) → 자동채점" onchange="setSubjText_(\'' + esc_(act.id) + '\',' + pi.n + ',this.value)" onkeydown="if(event.key===\'Enter\'){this.blur();}">' +
          '</div>';
          return rh;
        }
        const rCls = pi.status === "ok" ? " ok" : (pi.status === "bad" ? " bad" : "");
        const corSet = normAns_(pi.cor, pi.t).split(",");
        const stuSet = pi.stu ? pi.stu.split(",") : [];
        const opts = ["1","2","3","4","5","X"];
        let rh = '<div class="ans-row' + rCls + '"><span class="ans-no">' + pi.n + '.</span>' +
          (pi.origLbl ? '<span style="font-size:9.5px; font-weight:700; color:#c4b5fd; max-width:52px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="' + esc_(pi.origLbl) + '">' + esc_(pi.origLbl) + '</span>' : '');
        opts.forEach(function(o) {
          const picked = stuSet.indexOf(o) !== -1, isCor = corSet.indexOf(o) !== -1;
          let cls = "bub";
          if (picked) cls += " picked " + (pi.status === "ok" ? "ok" : "bad");
          if (isCor && !picked) cls += " ans-hint";
          rh += '<button type="button" class="' + cls + '" onclick="toggleAns_(\'' + esc_(act.id) + '\',' + pi.n + ',\'' + o + '\',\'' + pi.t + '\')">' + o + '</button>';
        });
        rh += '</div>';
        return rh;
      };
      const mid = Math.ceil(g.perItem.length / 2);
      h += '<div class="ans-grid">' +
        '<div class="ans-col">' + g.perItem.slice(0, mid).map(renderRow_).join("") + '</div>' +
        (g.perItem.length > mid ? ('<div class="ans-col">' + g.perItem.slice(mid).map(renderRow_).join("") + '</div>') : '') +
      '</div></div>';
    }
    host.innerHTML = h;
    if (prevScroll > 0) {
      const ng = host.querySelector(".ans-grid");
      if (ng) ng.scrollTop = prevScroll;
    }
  }

  function showLockedScreen_(msg) {
    const host = document.getElementById("appBody");
    host.className = "cms-hud-wrap";
    host.innerHTML = '<div class="cms-hud-card" style="text-align:center; padding:26px 20px;">' +
      '<div style="font-size:28px; margin-bottom:8px;">🔒</div>' +
      '<div style="font-size:15px; font-weight:900; margin-bottom:6px;">CMS 교사 포털 인증이 필요합니다</div>' +
      '<div style="font-size:12.5px; color:#94a3b8; line-height:1.6;">' + esc_(msg || "학생 정보 보호를 위해 CMS 교사 포털의 [CMS내신교재 채점 ➔ 🚀 직통 실시간 스캐너 열기] 버튼 또는 QR 코드로 접속해 주세요.") + '</div>' +
    '</div>';
  }

  function parseAuthFromHash_() {
    const hash = String(location.hash || "").replace(/^#/, "");
    const params = new URLSearchParams(hash);
    let api = params.get("api") || "";
    let tok = params.get("tok") || "";
    if (api && tok) {
      try {
        sessionStorage.setItem("cms_no_api", api);
        sessionStorage.setItem("cms_no_tok", tok);
        history.replaceState(null, "", location.pathname + location.search);
      } catch (_) {}
    } else {
      try {
        api = sessionStorage.getItem("cms_no_api") || "";
        tok = sessionStorage.getItem("cms_no_tok") || "";
      } catch (_) {}
    }
    S.apiUrl = api;
    S.tok = tok;
  }

  window.reloadBootData_ = async function(force) {
    if (!S.apiUrl || !S.tok) { showLockedScreen_(); return; }
    const pEl = document.getElementById("bootPct"), fEl = document.getElementById("bootFill");
    if (pEl) pEl.textContent = "52%"; if (fEl) fEl.style.width = "52%";
    try {
      const url = S.apiUrl + (S.apiUrl.indexOf("?") >= 0 ? "&" : "?") + "api=naesinOmrBoot&tok=" + encodeURIComponent(S.tok) + (force ? "&force=1" : "");
      const resp = await fetch(url, { redirect: "follow" });
      const res = await resp.json();
      if (!res || !res.success) {
        showLockedScreen_((res && res.message) || "인증 토큰이 만료되었습니다. 포털에서 다시 열어주세요.");
        return;
      }
      S.seasonCode = res.seasonCode || "2026_2_FINAL";
      S.seasonName = res.seasonName || "";
      S.teacher = res.teacher || "직통OMR스캐너";
      S.students = res.students || [];
      S.sections = res.sections || [];
      S.prepSections = Array.isArray(res.prepSections) ? res.prepSections : [];
      S.itemsBySec = res.itemsBySec || {};
      S.results = res.results || [];
      S.wrongSets = res.wrongSets || {};
      if (!S.selStudentId && S.students.length) S.selStudentId = S.students[0].erpId;
      const sb = document.getElementById("seasonBadge");
      const sy = document.getElementById("syncBadge");
      if (sb) sb.textContent = (S.seasonName || "2026 기말") + " · " + S.teacher;
      if (sy) sy.style.display = "";
      renderMain_();
      showTopToast_("✓ 정답 DB 연결 완료! [▶ 실시간 카메라 켜기]를 눌러 바로 채점하세요.", "ok");
    } catch (err) {
      showLockedScreen_("서버 연결 실패: " + (err.message || err));
    }
  };

  parseAuthFromHash_();
  reloadBootData_(false);
})();
</script>
</body>
</html>
