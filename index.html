<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>CMS 평촌 · 직통 실시간 OMR 스캐너</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #111827;
      --card: #1e293b;
      --line: rgba(148, 163, 184, 0.22);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #2563eb;
      --emerald: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --violet: #7c3aed;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    .app-shell {
      min-height: 100dvh; display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    /* Top Header */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      padding: 10px 14px; background: rgba(15, 23, 42, 0.94); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 30; backdrop-filter: blur(10px);
    }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 14.5px; letter-spacing: -0.02em; }
    .pill {
      font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
      background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border: 1px solid rgba(125, 211, 252, 0.3);
    }
    .pill.ok { background: rgba(16, 185, 129, 0.18); color: #6ee7b7; border-color: rgba(110, 231, 183, 0.35); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.08); color: #fff;
      padding: 8px 13px; border-radius: 10px; font-size: 12.5px; font-weight: 800;
      cursor: pointer; transition: all 0.13s ease; white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn.pri { background: var(--blue); border-color: #60a5fa; }
    .btn.em { background: #059669; border-color: #34d399; }
    .btn.red { background: #dc2626; border-color: #f87171; }
    .btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 8px; }

    /* CMS Signature HUD Card */
    @keyframes cmsHudSpin { to { transform: rotate(360deg); } }
    .cms-hud-ring { width: 20px; height: 20px; animation: cmsHudSpin 0.84s linear infinite; flex-shrink: 0; }
    .cms-hud-wrap {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 28px 16px; gap: 12px;
    }
    .cms-hud-card {
      width: 100%; max-width: 440px; padding: 14px 16px; border-radius: 14px;
      background: #1e293b; border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.42);
    }
    .cms-hud-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .cms-hud-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .cms-hud-badge {
      font-size: 10.5px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
      background: rgba(56, 189, 248, 0.18); color: #38bdf8; flex-shrink: 0;
    }
    .cms-hud-title { font-size: 13px; font-weight: 800; color: #f8fafc; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cms-hud-pct { font-size: 12px; font-weight: 900; color: #38bdf8; }
    .cms-hud-track { height: 6px; border-radius: 99px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .cms-hud-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #38bdf8, #10b981); transition: width 0.2s ease; }

    /* Top Toast HUD */
    .top-toast {
      position: fixed; left: 50%; top: 14px; transform: translate(-50%, -18px);
      z-index: 999; min-width: 240px; max-width: 92vw;
      background: rgba(15, 23, 42, 0.96); color: #fff; border: 1px solid rgba(148,163,184,0.35);
      border-radius: 12px; padding: 10px 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 800;
      opacity: 0; pointer-events: none; transition: all 0.18s ease;
    }
    .top-toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .top-toast.ok { border-color: rgba(52, 211, 153, 0.65); }
    .top-toast.warn { border-color: rgba(251, 191, 36, 0.7); }

    /* Main Split Layout (iPad/Galaxy Tab Landscape + Portrait Phone) */
    .main-grid {
      flex: 1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.9fr);
      gap: 12px; padding: 12px; align-items: start;
    }
    @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 12px; overflow: hidden;
    }

    /* Camera Stage */
    .cam-stage {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      min-height: 290px; max-height: 66dvh;
      background: #020617; border-radius: 12px; overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.35);
    }
    .cam-stage video { width: 100%; height: 100%; object-fit: contain; display: block; background: #020617; }
    .cam-stage canvas.cam-ov { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .cam-stage video.mirror, .cam-stage canvas.cam-ov.mirror { transform: scaleX(-1); }
    .cam-fab.active-opt { background: #2563eb; border-color: #93c5fd; }
    .cam-hud {
      position: absolute; left: 10px; right: 10px; top: 10px; z-index: 6;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none;
    }
    .cam-pill {
      padding: 5px 11px; border-radius: 999px; font-size: 11.5px; font-weight: 800;
      background: rgba(15, 23, 42, 0.84); color: #f8fafc; border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(6px);
    }
    .cam-pill.ok { background: rgba(5, 150, 105, 0.92); border-color: #6ee7b7; }
    .cam-pill.warn { background: rgba(217, 119, 6, 0.92); }
    .cam-pill.err { background: rgba(220, 38, 38, 0.92); }

    .cam-start-cover {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; text-align: center; gap: 11px;
      background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.35), rgba(2, 6, 23, 0.95));
    }
    .cam-start-cover.hidden { display: none; }

    .cam-live-bar {
      position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 7;
      display: none; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    }
    .cam-live-bar.show { display: flex; }
    .cam-fab {
      border: 1px solid rgba(255,255,255,0.28); border-radius: 999px;
      padding: 10px 16px; font-size: 13px; font-weight: 800; color: #fff;
      background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(8px); cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    }
    .cam-fab.snap { background: #10b981; border-color: #6ee7b7; }
    .cam-fab.torch-on { background: #d97706; border-color: #fde68a; }
    .cam-fab.stop { background: rgba(220, 38, 38, 0.92); }

    .cam-banner {
      position: absolute; left: 12px; right: 12px; bottom: 62px; z-index: 8;
      padding: 11px 14px; border-radius: 12px;
      background: rgba(5, 150, 105, 0.95); color: #fff;
      font-size: 13.5px; font-weight: 900; display: none;
      align-items: center; justify-content: space-between; gap: 10px;
      box-shadow: 0 10px 26px rgba(0,0,0,0.45);
    }
    .cam-banner.show { display: flex; }

    .cam-opts {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
      margin-top: 10px; font-size: 12px; font-weight: 700; color: #cbd5e1;
    }
    .sel, .inp {
      height: 32px; padding: 0 9px; border-radius: 8px;
      border: 1px solid var(--line); background: #0f172a; color: #f8fafc;
      font-size: 12px; font-weight: 700;
    }
    .rng-inp {
      width: 52px; height: 28px; text-align: center; padding: 0 4px;
      border-radius: 7px; border: 1px solid rgba(167,139,250,0.55); background: #0f172a; color: #fff;
      font-size: 12px; font-weight: 800;
    }

    /* Queue & Inspector */
    .q-list { display: flex; flex-direction: column; gap: 7px; max-height: 240px; overflow-y: auto; }
    .q-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 9px 11px; border-radius: 10px; cursor: pointer;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    }
    .q-item.sel { background: rgba(37, 99, 235, 0.22); border-color: #60a5fa; }
    .q-item.saved { border-left: 4px solid var(--emerald); }
    .q-item.unsaved { border-left: 4px solid var(--amber); }

    .ans-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; max-height: 360px; overflow-y: auto; margin-top: 8px; align-items: start;
    }
    @media (max-width: 520px) { .ans-grid { grid-template-columns: 1fr; } }
    .ans-col { display: flex; flex-direction: column; gap: 5px; }
    .ans-row {
      display: flex; align-items: center; gap: 4px; padding: 5px 7px;
      border-radius: 8px; background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    }
    .ans-row.ok { background: rgba(16,185,129,0.14); border-color: rgba(52,211,153,0.45); }
    .ans-row.bad { background: rgba(239,68,68,0.14); border-color: rgba(248,113,113,0.45); }
    .ans-no { font-size: 11.5px; font-weight: 800; color: #94a3b8; width: 24px; text-align: right; }
    .bub {
      width: 22px; height: 22px; border-radius: 999px; border: 1.5px solid #475569;
      background: #0f172a; color: #cbd5e1; font-size: 10.5px; font-weight: 800;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
    }
    .bub.ans-hint { border-color: #34d399; color: #6ee7b7; }
    .bub.picked.ok { background: #10b981; border-color: #10b981; color: #fff; }
    .bub.picked.bad { background: #ef4444; border-color: #ef4444; color: #fff; }
    .ans-row.subj-row { flex-direction: column; align-items: stretch; gap: 5px; padding: 7px 8px; }
    .ans-row.subj-row.pend { background: rgba(99,102,241,0.16); border-color: rgba(129,140,248,0.55); }
    .subj-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; flex-wrap: wrap; }
    .subj-cor {
      display: block; width: 100%; box-sizing: border-box;
      font-size: 11.5px; font-weight: 800; color: #bfdbfe;
      background: rgba(37,99,235,0.22); border: 1px solid rgba(96,165,250,0.48);
      border-radius: 6px; padding: 4px 8px; line-height: 1.42;
      white-space: normal; word-break: keep-all; overflow-wrap: anywhere;
    }
    .subj-crop-wrap { width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid rgba(148,163,184,0.45); background: #fff; }
    .subj-crop { display: block; width: 100%; height: auto; min-height: 44px; max-height: 76px; object-fit: contain; background: #fff; cursor: zoom-in; transition: max-height 0.14s ease; }
    .subj-crop.exp { max-height: 150px; cursor: zoom-out; }
    .subj-inp {
      width: 100%; height: 28px; padding: 0 8px; border-radius: 6px;
      border: 1px solid rgba(148,163,184,0.45); background: #0f172a; color: #f8fafc;
      font-size: 12px; font-weight: 800;
    }
    .subj-inp:focus { outline: none; border-color: #818cf8; box-shadow: 0 0 0 2px rgba(129,140,248,0.25); }
    .subj-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      padding: 8px 10px; border-radius: 9px; margin-bottom: 8px;
      background: rgba(79,70,229,0.2); border: 1px solid rgba(129,140,248,0.45);
      font-size: 11.5px; color: #e0e7ff;
    }
  </style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <span>📷 CMS 직통 실시간 OMR 스캐너 <small style="opacity:0.75; font-size:10px; font-weight:700;">v2.6</small></span>
      <span id="seasonBadge" class="pill">iframe 없음 · 전 기기 지원</span>
      <span id="syncBadge" class="pill ok" style="display:none;">출석부 실시간 연동</span>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button type="button" class="btn sm" onclick="reloadBootData_(true)">↻ 명단 새로고침</button>
      <button type="button" class="btn sm" onclick="window.close()">닫기</button>
    </div>
  </header>

  <div id="appBody" class="cms-hud-wrap">
    <div class="cms-hud-card">
      <div class="cms-hud-top">
        <div class="cms-hud-left">
          <svg class="cms-hud-ring" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="22 57"/><circle cx="12" cy="12" r="9" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 57" stroke-dashoffset="-14"/><circle cx="12" cy="12" r="9" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="19 57" stroke-dashoffset="-20"/></svg>
          <span class="cms-hud-badge">연결 중</span>
          <span class="cms-hud-title">CMS 내신교재 정답 DB · 학생 명단 연결 중...</span>
        </div>
        <span class="cms-hud-pct" id="bootPct">18%</span>
      </div>
      <div class="cms-hud-track"><div class="cms-hud-fill" id="bootFill" style="width:18%;"></div></div>
    </div>
  </div>
</div>

<div id="topToast" class="top-toast"><span id="topToastMsg"></span></div>

<script>
(function() {
  "use strict";

  const IS_DESKTOP_DEV = (function() {
    const ua = (navigator && navigator.userAgent) || "";
    const isMob = /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && (navigator.maxTouchPoints || 0) > 1);
    return !isMob;
  })();

  const S = {
    apiUrl: "",
    tok: "",
    teacher: "직통OMR스캐너",
    seasonCode: "2026_2_FINAL",
    seasonName: "",
    students: [],
    sections: [],
    prepSections: [],
    itemsBySec: {},
    results: [],
    wrongSets: {},
    selStudentId: "",
    selSecKey: "2s_m_1",
    rangeFrom: 1,
    rangeTo: 24,
    camRunning: false,
    camFacing: IS_DESKTOP_DEV ? "user" : "environment",
    camDeviceId: "",
    camDevices: [],
    mirrorPreview: IS_DESKTOP_DEV,
    torchOn: false,
    autoSave: true,
    soundOn: true,
    allowBlankQr: false,
    queue: [],
    activeId: ""
  };

  let STREAM = null, RAF = null, LAST_TICK = 0;
  let STABLE_CORNERS = null, STABLE_CNT = 0, NO_CORNER_FRAMES = 0;
  let LAST_SIG = "", LAST_SIG_AT = 0;
  let AUDIO_CTX = null;

  const OMR_W = 800, OMR_H = 1120;
  const OMR_CORNERS_STD = [
    { x: 46, y: 46 }, { x: 754, y: 46 }, { x: 46, y: 1074 }, { x: 754, y: 1074 }
  ];
  const OMR_RANGE_COL_X = [84, 430];
  const OMR_COL_X = [
    [158, 206, 254, 302, 350],
    [514, 562, 610, 658, 706]
  ];

  function esc_(s) {
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  let toastTm_ = null;
  function showTopToast_(msg, kind) {
    const el = document.getElementById("topToast");
    const m = document.getElementById("topToastMsg");
    if (!el || !m) return;
    m.textContent = String(msg || "");
    el.className = "top-toast show " + (kind === "ok" ? "ok" : (kind === "warn" ? "warn" : ""));
    clearTimeout(toastTm_);
    toastTm_ = setTimeout(function() { el.classList.remove("show"); }, kind === "warn" ? 5000 : 3200);
  }

  function beep_(type) {
    if (!S.soundOn) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!AUDIO_CTX) AUDIO_CTX = new AC();
      if (AUDIO_CTX.state === "suspended") AUDIO_CTX.resume();
      const now = AUDIO_CTX.currentTime;
      const tone = function(freq, st, dur) {
        const osc = AUDIO_CTX.createOscillator();
        const g = AUDIO_CTX.createGain();
        osc.type = type === "warn" ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq, now + st);
        g.gain.setValueAtTime(0.16, now + st);
        g.gain.exponentialRampToValueAtTime(0.001, now + st + dur);
        osc.connect(g); g.connect(AUDIO_CTX.destination);
        osc.start(now + st); osc.stop(now + st + dur);
      };
      if (type === "ok") { tone(1046.5, 0, 0.08); tone(1568, 0.08, 0.14); }
      else { tone(600, 0, 0.1); tone(440, 0.11, 0.15); }
    } catch (_) {}
  }

  function getOmrGridSpec_(countOrLayout) {
    if (countOrLayout > 50) {
      return { layout: 70, is70: true, is50: true, perCol: 35, startY: 240, stepY: 23.5, radius: 9.0 };
    }
    if (countOrLayout > 30) {
      return { layout: 50, is70: false, is50: true, perCol: 25, startY: 248, stepY: 32, radius: 11.5 };
    }
    return { layout: 30, is70: false, is50: false, perCol: 15, startY: 268, stepY: 50, radius: 15 };
  }

  function getSecMeta_(k) {
    return S.sections.find(function(x) { return x.key === k; })
      || (S.prepSections || []).find(function(x) { return x.key === k; })
      || { key: k, shortLbl: k, title: k, count: 20 };
  }
  function getStu_(id) {
    const clean = String(id == null ? "" : id).trim();
    if (!clean) return null;
    return S.students.find(function(x) { return String(x.erpId || "").trim() === clean; }) || null;
  }

  function buildRangesFromCheckedNos_(checkedNos, cardFrom, cardTo) {
    if (!checkedNos || !checkedNos.length) return [[cardFrom, cardTo]];
    const sorted = checkedNos.slice().sort(function(a, b) { return a - b; });
    const out = [];
    for (let i = 0; i < sorted.length; i += 2) {
      if (i + 1 < sorted.length) out.push([sorted[i], sorted[i + 1]]);
      else out.push([sorted[i], cardTo]);
    }
    return out;
  }

  function buildRunsFromNos_(nos) {
    if (!nos || !nos.length) return [];
    const sorted = nos.slice().sort(function(a, b) { return a - b; });
    const out = [];
    let s = sorted[0], prev = sorted[0];
    for (let i = 1; i < sorted.length; i++) {
      if (sorted[i] === prev) continue;
      if (sorted[i] === prev + 1) { prev = sorted[i]; }
      else { out.push([s, prev]); s = prev = sorted[i]; }
    }
    out.push([s, prev]);
    return out;
  }

  function parseRangesText_(txt, maxN, defFrom, defTo) {
    const s = String(txt || "").trim();
    const cap = maxN || 999;
    if (!s) return [[defFrom || 1, defTo || cap]];
    const parts = s.split(/[,;/]+/).map(function(x) { return x.trim(); }).filter(Boolean);
    const out = [];
    parts.forEach(function(part) {
      const mBoth = part.match(/^(\d+)\s*[-~]\s*(\d+)$/);
      const mOpenEnd = part.match(/^(\d+)\s*[-~]\s*$/);
      const mOpenStart = part.match(/^[-~]\s*(\d+)$/);
      if (mBoth) {
        const a = Math.max(1, Math.min(cap, Number(mBoth[1])));
        const b = Math.max(a, Math.min(cap, Number(mBoth[2])));
        out.push([a, b]);
      } else if (mOpenEnd) {
        const a = Math.max(1, Math.min(cap, Number(mOpenEnd[1])));
        out.push([a, cap]);
      } else if (mOpenStart) {
        const b = Math.max(1, Math.min(cap, Number(mOpenStart[1])));
        out.push([1, b]);
      } else if (/^\d+$/.test(part)) {
        const n = Math.max(1, Math.min(cap, Number(part)));
        out.push([n, n]);
      }
    });
    return out.length ? out : [[defFrom || 1, defTo || cap]];
  }

  function formatRanges_(ranges) {
    return (ranges || []).map(function(r) {
      return r[0] === r[1] ? String(r[0]) : (r[0] + "~" + r[1]);
    }).join(", ");
  }

  function isInRanges_(n, ranges) {
    if (!ranges || !ranges.length) return true;
    for (let i = 0; i < ranges.length; i++) {
      if (n >= ranges[i][0] && n <= ranges[i][1]) return true;
    }
    return false;
  }

  function matchSubjShortAns_(stuRaw, corRaw) {

    let found = runPass_(178, 0.80, 0);

    if (!found) found = runPass_(0, 0, Math.min(135, Math.max(70, p25 + 28)));
    return found;
  }

  function warpOmrToStandardCanvas_(srcCanvas, corners4) {
    const Hinv = solveHomography_(OMR_CORNERS_STD, corners4);
    if (!Hinv) return null;
    const sw = srcCanvas.width, sh = srcCanvas.height;
    const sData = srcCanvas.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, sw, sh).data;
    const dstCv = document.createElement("canvas");
    dstCv.width = OMR_W; dstCv.height = OMR_H;
    const dCtx = dstCv.getContext("2d", { willReadFrequently: true });
    const dImg = dCtx.createImageData(OMR_W, OMR_H);
    const dd = dImg.data;
    const h0 = Hinv[0], h1 = Hinv[1], h2 = Hinv[2], h3 = Hinv[3], h4 = Hinv[4], h5 = Hinv[5], h6 = Hinv[6], h7 = Hinv[7];
    for (let y = 0; y < OMR_H; y++) {
      const yOff = y * OMR_W * 4, wy1 = h1 * y + h2, wy4 = h4 * y + h5, wy7 = h7 * y + 1;

        if (ix >= 0 && iy >= 0 && ix < sw - 1 && iy < sh - 1) {

          dd[di+2] = sData[o00+2]*w00 + sData[o10+2]*w10 + sData[o01+2]*w01 + sData[o11+2]*w11;

    }

    return dstCv;
  }

  function parseOmrQrPayload_(rawStr) {
    if (!rawStr || rawStr.indexOf("CMSOMR|") !== 0) return null;
    const parts = rawStr.split("|");
    if (parts.length < 6) return null;
    if (parts[1] === "W" || parts[1] === "W2") {
      return {
        isWrongRetest: true,
        isPrepExam: false,
        isV2Spacious: parts[1] === "W2",
        erpId: parts[2] === "BLANK" ? "" : String(parts[2] || "").trim(),
        isBlankCard: parts[2] === "BLANK",
        setId: String(parts[3] || "").trim().toUpperCase(),
        secKey: "__WRONG_SET__",
        fromNo: Number(parts[4]) || 1,
        toNo: Number(parts[5]) || 20,
        layout: Number(parts[6]) || 30
      };
    }
    if (parts[1] === "P" || parts[1] === "P2") {
      const pid = String(parts[3] || "").trim();
      return {
        isWrongRetest: false,
        isPrepExam: true,
        isV2Spacious: parts[1] === "P2",
        erpId: parts[2] === "BLANK" ? "" : String(parts[2] || "").trim(),
        isBlankCard: parts[2] === "BLANK",
        prepSetId: pid,
        secKey: "NP:" + pid,
        fromNo: Number(parts[4]) || 1,
        toNo: Number(parts[5]) || 20,
        layout: Number(parts[6]) || 30

    }
    return {
      isWrongRetest: false,
      isPrepExam: false,
      isV2Spacious: parts[1] === "2",
      erpId: parts[2] === "BLANK" ? "" : String(parts[2] || "").trim(),
      isBlankCard: parts[2] === "BLANK",
      secKey: String(parts[3] || "").trim(),
      fromNo: Number(parts[4]) || 1,
      toNo: Number(parts[5]) || 20,
      layout: Number(parts[6]) || 30

  }

  // 코너 마커(x:732..776)를 완전히 제외한 순수 QR 영역(x:560..726, y:20..188) 다중 강화 해독
  function tryDecodeQrFromWarped_(cv) {
    if (typeof window.jsQR !== "function") return null;
    const sx = 560, sy = 20, sw = 166, sh = 168;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    // Pass 1: 원본 깨끗한 크롭
    try {
      const img1 = ctx.getImageData(sx, sy, sw, sh);
      const r1 = window.jsQR(img1.data, sw, sh, { inversionAttempts: "attemptBoth" });
      const p1 = r1 && parseOmrQrPayload_(r1.data);
      if (p1) return p1;
    } catch (_) {}
    // Pass 2 & 3: 2배 확대 + 명암 자동 스트레칭 + Otsu 이진화 (흐림·저대비·그림자 구출)

      const up = document.createElement("canvas");
      const uw = sw * 2, uh = sh * 2;
      up.width = uw; up.height = uh;
      const uCtx = up.getContext("2d", { willReadFrequently: true });
      uCtx.imageSmoothingEnabled = true;
      uCtx.drawImage(cv, sx, sy, sw, sh, 0, 0, uw, uh);
      const img2 = uCtx.getImageData(0, 0, uw, uh);
      const d = img2.data;
      const grays = new Uint8Array(uw * uh);
      const hist = new Uint32Array(256);
      for (let i = 0, p = 0; i < grays.length; i++, p += 4) {
        const g = (d[p] * 77 + d[p + 1] * 150 + d[p + 2] * 29) >> 8;
        grays[i] = g; hist[g]++;

      const tot = grays.length;
      let acc = 0, lo = 0, hi = 255;
      for (let v = 0; v < 256; v++) { acc += hist[v]; if (acc >= tot * 0.04) { lo = v; break; } }
      acc = 0;
      for (let v = 255; v >= 0; v--) { acc += hist[v]; if (acc >= tot * 0.04) { hi = v; break; } }
      const span = Math.max(20, hi - lo);
      for (let i = 0, p = 0; i < grays.length; i++, p += 4) {
        const st = Math.max(0, Math.min(255, Math.round((grays[i] - lo) * 255 / span)));
        d[p] = d[p + 1] = d[p + 2] = st; d[p + 3] = 255;
      }
      const r2 = window.jsQR(d, uw, uh, { inversionAttempts: "attemptBoth" });
      const p2 = r2 && parseOmrQrPayload_(r2.data);
      if (p2) return p2;

      // Otsu 이진화
      let sumAll = 0;
      for (let v = 0; v < 256; v++) sumAll += v * hist[v];

      for (let t = 0; t < 256; t++) {
        wB += hist[t]; if (!wB) continue;
        const wF = tot - wB; if (!wF) break;
        sumB += t * hist[t];
        const mB = sumB / wB, mF = (sumAll - sumB) / wF;
        const vb = wB * wF * (mB - mF) * (mB - mF);
        if (vb > bestVar) { bestVar = vb; bestT = t; }
      }
      for (let i = 0, p = 0; i < grays.length; i++, p += 4) {
        const bw = grays[i] < bestT ? 0 : 255;
        d[p] = d[p + 1] = d[p + 2] = bw; d[p + 3] = 255;
      }
      const r3 = window.jsQR(d, uw, uh, { inversionAttempts: "attemptBoth" });
      const p3 = r3 && parseOmrQrPayload_(r3.data);
      if (p3) return p3;
    } catch (_) {}
    return null;
  }

  // 원근변환 전 원본 고해상도 프레임에서 직접 QR 탐지 + 4코너 위치로 100% 정확한 정방향 확정
  function tryDecodeQrFromRawSrc_(srcCanvas, quad4) {
    if (typeof window.jsQR !== "function") return null;
    try {
      const sw = srcCanvas.width, sh = srcCanvas.height;
      const maxDim = Math.max(sw, sh);
      const sc = Math.min(1, 960 / maxDim);
      const tw = Math.round(sw * sc), th = Math.round(sh * sc);

      tmp.width = tw; tmp.height = th;
      const tCtx = tmp.getContext("2d", { willReadFrequently: true });
      tCtx.drawImage(srcCanvas, 0, 0, tw, th);
      const img = tCtx.getImageData(0, 0, tw, th);
      const r = window.jsQR(img.data, tw, th, { inversionAttempts: "attemptBoth" });
      const parsed = r && parseOmrQrPayload_(r.data);
      if (parsed && r.location) {
        const loc = r.location;
        const qcx = ((loc.topLeftCorner.x + loc.topRightCorner.x + loc.bottomLeftCorner.x + loc.bottomRightCorner.x) / 4) / sc;
        const qcy = ((loc.topLeftCorner.y + loc.topRightCorner.y + loc.bottomLeftCorner.y + loc.bottomRightCorner.y) / 4) / sc;
        let bestIdx = 1, bestD = 1e18;
        for (let i = 0; i < 4; i++) {
          const d = Math.hypot(quad4[i].x - qcx, quad4[i].y - qcy);
          if (d < bestD) { bestD = d; bestIdx = i; }
        }
        return { qrMeta: parsed, trIdx: bestIdx };
      }
    } catch (_) {}
    return null;
  }

  function measureQrEdgeDensity_(cv) {
    // 그림자가 아닌 QR 특유의 고주파 흑백 교차(체커보드) 밀도 측정
    const img = cv.getContext("2d", { willReadFrequently: true }).getImageData(572, 32, 144, 144);
    const d = img.data, w = 144, h = 144;
    let edges = 0;
    for (let y = 2; y < h - 2; y += 2) {
      for (let x = 2; x < w - 2; x += 2) {
        const p = (y * w + x) * 4;
        const l0 = (d[p] * 77 + d[p + 1] * 150 + d[p + 2] * 29) >> 8;

        const lR = (d[pR] * 77 + d[pR + 1] * 150 + d[pR + 2] * 29) >> 8;
        const lD = (d[pD] * 77 + d[pD + 1] * 150 + d[pD + 2] * 29) >> 8;
        if (Math.abs(l0 - lR) > 36) edges++;
        if (Math.abs(l0 - lD) > 36) edges++;
      }
    }
    return edges;
  }

  function warpAndOrientOmrCanvas_(srcCanvas, quad4) {
    const w0 = warpOmrToStandardCanvas_(srcCanvas, quad4);
    if (!w0) return null;
    const qr0 = tryDecodeQrFromWarped_(w0);
    if (qr0) return { canvas: w0, qrMeta: qr0 };

    // 180도 회전 확인
    const quad180 = [quad4[3], quad4[2], quad4[1], quad4[0]];
    const w180 = warpOmrToStandardCanvas_(srcCanvas, quad180);
    if (w180) {
      const qr180 = tryDecodeQrFromWarped_(w180);
      if (qr180) return { canvas: w180, qrMeta: qr180 };
    }

    // 원근변환 전 원본 고해상도 이미지에서 직접 QR 해독 → QR이 가장 가까운 코너를 TR로 100% 확정!
    const rawHit = tryDecodeQrFromRawSrc_(srcCanvas, quad4);
    if (rawHit) {
      if (rawHit.trIdx === 1) return { canvas: w0, qrMeta: rawHit.qrMeta };
      if (rawHit.trIdx === 2 && w180) return { canvas: w180, qrMeta: rawHit.qrMeta };
      const qAlt = rawHit.trIdx === 0
        ? [quad4[2], quad4[0], quad4[3], quad4[1]]
        : [quad4[1], quad4[3], quad4[0], quad4[2]];
      const wAlt = warpOmrToStandardCanvas_(srcCanvas, qAlt);
      if (wAlt) return { canvas: wAlt, qrMeta: rawHit.qrMeta };
    }

    // 노트북 웹캠/가상카메라 드라이버가 좌우반전(Mirror) 스트림을 보내는 경우 자동 정방향 복원 (4방향 미러 탐색)
    const mirrorQuads = [
      [quad4[1], quad4[0], quad4[3], quad4[2]], // 좌우반전 0도
      [quad4[2], quad4[3], quad4[0], quad4[1]], // 좌우반전 180도
      [quad4[0], quad4[2], quad4[1], quad4[3]], // 좌우반전 90도
      [quad4[3], quad4[1], quad4[2], quad4[0]]  // 좌우반전 270도

    for (let mi = 0; mi < mirrorQuads.length; mi++) {
      const wm = warpOmrToStandardCanvas_(srcCanvas, mirrorQuads[mi]);

        if (qrm) return { canvas: wm, qrMeta: qrm };

    }

    // QR이 완전히 흐려 못 읽을 때만 QR 영역 고주파 체커보드 엣지 밀도로 정방향 판별 (그림자에 속지 않음)

      const e180 = measureQrEdgeDensity_(w180);

    }
    return { canvas: w0, qrMeta: null };
  }

  function readWarpedOmrCanvas_(warpedPack) {
    const warpedCanvas = warpedPack && warpedPack.canvas ? warpedPack.canvas : warpedPack;
    const ctx = warpedCanvas.getContext("2d", { willReadFrequently: true });
    let qrMeta = (warpedPack && warpedPack.qrMeta) || tryDecodeQrFromWarped_(warpedCanvas);

    const qrFound = Boolean(qrMeta);
    const isWrongRetest = Boolean(qrMeta && qrMeta.isWrongRetest);
    const isPrepExam = Boolean(qrMeta && qrMeta.isPrepExam);
    const wrongSetId = isWrongRetest ? String(qrMeta.setId || "").toUpperCase() : "";
    const prepSetId = isPrepExam ? String(qrMeta.prepSetId || "").trim() : "";
    const secKey = isWrongRetest
      ? ("WR:" + wrongSetId)
      : (isPrepExam
        ? ("NP:" + prepSetId)
        : ((qrMeta && qrMeta.secKey && S.itemsBySec[qrMeta.secKey]) ? qrMeta.secKey : S.selSecKey));
    const secItemsAll = isWrongRetest ? getWrongSetVirtualItems_(wrongSetId) : (S.itemsBySec[secKey] || []);
    const fromNo = qrMeta ? qrMeta.fromNo : (S.rangeFrom || 1);
    const toNo = qrMeta ? qrMeta.toNo : (S.rangeTo || secItemsAll.length || 20);
    // QR이 읽혔으면 QR 학생 ID만 사용(없으면 빈칸), QR 미인식 시 공용모드일 때만 기본 학생 사용
    const erpId = qrMeta
      ? (qrMeta.erpId || "")
      : (S.allowBlankQr ? S.selStudentId : "");
    const missingWrongSet = Boolean(isWrongRetest && wrongSetId && !secItemsAll.length);
    const missingPrepSet = Boolean(isPrepExam && prepSetId && !secItemsAll.length);

    const rangeItems = secItemsAll.filter(function(it) { return it.n >= fromNo && it.n <= toNo; });
    const count = rangeItems.length || Math.max(1, toNo - fromNo + 1);
    const spec = getOmrGridSpec_(qrMeta && qrMeta.layout ? qrMeta.layout : count);
    const fullImg = ctx.getImageData(0, 0, OMR_W, OMR_H).data;

    function sampleLum_(cx, cy, rad) {
      let sum = 0, cnt = 0, r2 = rad * rad;
      const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(OMR_W - 1, Math.ceil(cx + rad));
      const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(OMR_H - 1, Math.ceil(cy + rad));
      for (let y = y0; y <= y1; y++) {
        const dy = y - cy, ro = y * OMR_W;
        for (let x = x0; x <= x1; x++) {
          const dx = x - cx;
          if (dx * dx + dy * dy > r2) continue;

          sum += (fullImg[p] * 77 + fullImg[p + 1] * 150 + fullImg[p + 2] * 29) >> 8;
          cnt++;
        }
      }
      return cnt ? sum / cnt : 255;
    }

    function measureDark_(cx, cy, rad, paperLum) {
      let darkCnt = 0, totCnt = 0, lumSum = 0, r2 = rad * rad;
      const thresh = Math.min(195, paperLum - 38);
      const x0 = Math.max(0, Math.floor(cx - rad)), x1 = Math.min(OMR_W - 1, Math.ceil(cx + rad));
      const y0 = Math.max(0, Math.floor(cy - rad)), y1 = Math.min(OMR_H - 1, Math.ceil(cy + rad));
      for (let y = y0; y <= y1; y++) {
        const dy = y - cy, ro = y * OMR_W;
        for (let x = x0; x <= x1; x++) {
          const dx = x - cx;
          if (dx * dx + dy * dy > r2) continue;
          const p = (ro + x) * 4;
          const lum = (fullImg[p] * 77 + fullImg[p + 1] * 150 + fullImg[p + 2] * 29) >> 8;

          if (lum < thresh) darkCnt++;

    prevCv.width = OMR_W; prevCv.height = OMR_H;
    const pCtx = prevCv.getContext("2d");
    pCtx.drawImage(warpedCanvas, 0, 0);

    function getOmrV2Layout_(rawItems) {
      const items = Array.isArray(rawItems) ? rawItems : [];
      const mcqList = [], subjList = [];
      items.forEach(function(it) {
        if (it && (it.t === "subj" || it.type === "subj")) subjList.push(it);
        else if (it) mcqList.push(it);
      });
      const isAllSubj = items.length > 0 && mcqList.length === 0;
      const slots = [];
      if (isAllSubj) {
        if (subjList.length <= 12) {
          const topY = 234, botY = 1042, stepY = Math.min(92, (botY - topY) / Math.max(1, subjList.length));
          const boxH = Math.max(44, Math.min(82, stepY - 8));
          for (let i = 0; i < subjList.length; i++) {
            const cy = topY + stepY * (i + 0.5);
            slots.push({ it: subjList[i], kind: "subj", col: 0, cy: cy, rx: OMR_RANGE_COL_X[0], bx0: 136, by0: cy - boxH / 2, bw: 596, bh: boxH, stepY: stepY, radius: 13 });
          }
        } else {
          const perCol = Math.ceil(subjList.length / 2), topY = 234, botY = 1042, stepY = (botY - topY) / Math.max(1, perCol);
          const boxH = Math.max(24, Math.min(58, stepY - 7));
          for (let i = 0; i < subjList.length; i++) {
            const col = i < perCol ? 0 : 1, row = i % perCol, cy = topY + stepY * (row + 0.5);
            slots.push({ it: subjList[i], kind: "subj", col: col, cy: cy, rx: OMR_RANGE_COL_X[col], bx0: col === 0 ? 136 : 482, by0: cy - boxH / 2, bw: 256, bh: boxH, stepY: stepY, radius: 11 });
          }
        }
        return { slots: slots };
      }
      const subjCnt = subjList.length, mcqPerCol = Math.max(1, Math.ceil(mcqList.length / 2));
      const desiredSubjH = subjCnt === 1 ? 195 : (subjCnt === 2 ? 285 : (subjCnt === 3 ? 330 : Math.min(430, subjCnt * 86 + 34)));
      const topMcqY = 236, maxMcqAvailH = Math.max(240, (1046 - topMcqY) - desiredSubjH - 18);
      const mcqStepY = Math.min(44, Math.max(22, maxMcqAvailH / mcqPerCol));
      const mcqRadius = mcqStepY >= 36 ? 12.5 : (mcqStepY >= 29 ? 10.5 : 8.5);
      for (let i = 0; i < mcqList.length; i++) {
        const col = i < mcqPerCol ? 0 : 1, row = i % mcqPerCol;
        slots.push({ it: mcqList[i], kind: "mcq", col: col, cy: topMcqY + mcqStepY * (row + 0.5), rx: OMR_RANGE_COL_X[col], stepY: mcqStepY, radius: mcqRadius });
      }
      const dividerY = Math.round(topMcqY + mcqPerCol * mcqStepY + 12);
      const subjStartY = dividerY + 30, subjAvailH = Math.max(90, 1046 - subjStartY);
      const subjStepY = Math.min(156, subjAvailH / Math.max(1, subjCnt));
      const subjBoxH = Math.max(46, Math.min(140, subjStepY - 10));
      for (let j = 0; j < subjCnt; j++) {
        const cy = subjStartY + subjStepY * (j + 0.5);
        slots.push({ it: subjList[j], kind: "subj", col: 0, cy: cy, rx: OMR_RANGE_COL_X[0], bx0: 136, by0: cy - subjBoxH / 2, bw: 596, bh: subjBoxH, stepY: subjStepY, radius: 13 });
      }
      return { slots: slots };
    }

    function cropSubjStrip_(sx, sy, sw, sh, scale) {
      const sc = Math.min(scale || 1.6, 540 / Math.max(1, sw));
      const cw = Math.max(1, Math.round(sw * sc));
      const ch = Math.max(1, Math.round(sh * sc));
      const c = document.createElement("canvas");
      c.width = cw; c.height = ch;
      const g = c.getContext("2d", { willReadFrequently: true });
      g.fillStyle = "#ffffff";
      g.fillRect(0, 0, cw, ch);
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = "high";
      g.drawImage(warpedCanvas, sx, sy, sw, sh, 0, 0, cw, ch);
      try {
        const id = g.getImageData(0, 0, cw, ch);
        const d = id.data;
        const lums = [];
        for (let i = 0; i < d.length; i += 16) lums.push((d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8);
        lums.sort(function(a, b) { return a - b; });
        const whitePt = Math.max(145, lums[Math.floor(lums.length * 0.88)] || 230);
        const blackPt = Math.min(whitePt - 55, Math.max(18, (lums[Math.floor(lums.length * 0.02)] || 25) - 6));
        const span = Math.max(45, whitePt - blackPt);
        for (let i = 0; i < d.length; i += 4) {

            let v = (d[i + ci] - blackPt) / span;

      return c.toDataURL("image/jpeg", 0.80);
    }

    const answers = {};
    const subjCrops = {};
    const subjPendingNos = [];
    let warnCount = 0;
    const isV2Spacious = Boolean(qrMeta && qrMeta.isV2Spacious);
    let rangeMarked = false;
    let ranges = [[fromNo, toNo]];
    let effFromNo = fromNo, effToNo = toNo;

    if (isV2Spacious) {
      const lay = getOmrV2Layout_(rangeItems);
      const rSamp = lay.slots.map(function(sl) {
        const pLum = Math.max(75, sampleLum_(sl.rx - 14, sl.cy, 3));
        return { n: sl.it.n, rx: sl.rx, cy: sl.cy, sc: measureDark_(sl.rx, sl.cy, 5.8, pLum) };
      });
      const rSrt = rSamp.map(function(x) { return x.sc; }).sort(function(a, b) { return a - b; });
      const rBs = rSrt.length ? rSrt[Math.floor(rSrt.length * 0.25)] : 0;
      const rChk = rSamp.filter(function(s) { return (s.sc - rBs) >= 0.22 && s.sc >= 0.30; });
      rangeMarked = rChk.length >= 1;
      ranges = rangeMarked ? buildRangesFromCheckedNos_(rChk.map(function(r) { return r.n; }), fromNo, toNo) : [[fromNo, toNo]];
      effFromNo = ranges[0][0]; effToNo = ranges[ranges.length - 1][1];
      if (rangeMarked) rChk.forEach(function(rc) { pCtx.strokeStyle = "#7c3aed"; pCtx.lineWidth = 3.5; pCtx.strokeRect(rc.rx - 9.5, rc.cy - 9.5, 19, 19); });

      lay.slots.forEach(function(sl) {
        const it = sl.it;
        if (!isInRanges_(it.n, ranges)) {
          pCtx.fillStyle = "rgba(148,163,184,0.28)";
          if (sl.kind === "subj") pCtx.fillRect(sl.bx0, sl.by0, sl.bw, sl.bh);
          else pCtx.fillRect(sl.col === 0 ? 72 : 416, sl.cy - sl.stepY / 2 + 2, 314, sl.stepY - 4);
          return;
        }
        if (sl.kind === "subj") {
          const px = Math.round(sl.bx0), py = Math.round(sl.by0), pw = Math.round(sl.bw), ph = Math.round(sl.bh);
          const sx = Math.max(0, px - 2), sy = Math.max(0, py - 2);
          const sw = Math.min(OMR_W - sx, pw + 14), sh = Math.min(OMR_H - sy, ph + 4);
          subjCrops[String(it.n)] = cropSubjStrip_(sx, sy, sw, sh, 1.4);
          subjPendingNos.push(it.n);
          pCtx.save(); pCtx.strokeStyle = "#6366f1"; pCtx.lineWidth = 2.5; pCtx.setLineDash([6, 4]);
          pCtx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
          pCtx.fillStyle = "rgba(99,102,241,0.06)"; pCtx.fillRect(px + 1, py + 1, pw - 2, ph - 2);
          pCtx.setLineDash([]); pCtx.fillStyle = "#4f46e5"; pCtx.font = "800 11px sans-serif"; pCtx.textAlign = "right";
          pCtx.fillText("✍️단답(넉넉형)", px + pw - 6, py + 14); pCtx.restore();
          return;
        }
        const iRad = sl.radius * 0.72;
        const pLum = Math.max(75, (sampleLum_(OMR_COL_X[sl.col][0] + 24, sl.cy, 4) + sampleLum_(OMR_COL_X[sl.col][2] + 24, sl.cy, 4)) / 2);
        const scores = [];
        for (let b = 0; b < 5; b++) scores.push({ b: b, bx: OMR_COL_X[sl.col][b], sc: measureDark_(OMR_COL_X[sl.col][b], sl.cy, iRad, pLum) });
        const sorted = scores.slice().sort(function(a, b) { return a.sc - b.sc; });
        const baseSc = (sorted[0].sc + sorted[1].sc) / 2;
        const marked = [];
        scores.forEach(function(s) { const dl = s.sc - baseSc; if (dl >= 0.165 || s.sc >= 0.42) marked.push({ b: s.b, bx: s.bx, dl: dl, sc: s.sc }); });
        marked.sort(function(a, b) { return b.dl - a.dl; });
        let val = "", isWarn = false;
        if (marked.length > 0) {
          if (it.t === "multi") val = marked.map(function(m) { return String(m.b + 1); }).sort().join(",");
          else if (marked.length >= 2 && marked[1].dl > marked[0].dl * 0.68 && marked[1].dl > 0.22) { val = marked.slice(0, 2).map(function(m) { return String(m.b + 1); }).sort().join(","); isWarn = true; }
          else val = String(marked[0].b + 1);
        }
        if (val) answers[String(it.n)] = val;
        if (isWarn) warnCount++;
        const corNorm = normAns_(it.a, it.t);
        const isOk = val ? (val === corNorm) : false;
        pCtx.lineWidth = 3.5;
        if (val) marked.forEach(function(mk) { pCtx.beginPath(); pCtx.arc(mk.bx, sl.cy, sl.radius + 3, 0, Math.PI * 2); pCtx.strokeStyle = isWarn ? "#f59e0b" : (isOk ? "#10b981" : "#ef4444"); pCtx.stroke(); });
        if (!isOk && corNorm) {
          corNorm.split(",").forEach(function(cd) {
            const ci = Number(cd) - 1;
            if (ci >= 0 && ci < 5) { pCtx.beginPath(); pCtx.arc(OMR_COL_X[sl.col][ci], sl.cy, sl.radius - 2, 0, Math.PI * 2); pCtx.strokeStyle = "#2563eb"; pCtx.lineWidth = 2.5; pCtx.stroke(); }
          });
        }
      });
    } else {
      const totalSlots = Math.min(spec.perCol * 2, rangeItems.length);
      // [□ 구간] 다중 구간 체크박스 판독 (예: 1·24·30·35·47 → 1~24, 30~35, 47~끝까지!)
      const rangeRad = spec.is70 ? 4.4 : (spec.is50 ? 5.2 : 6.8);
      const rangeSamples = [];
      for (let idx = 0; idx < totalSlots; idx++) {
        const it = rangeItems[idx], col = idx < spec.perCol ? 0 : 1, row = idx % spec.perCol;
        const cy = spec.startY + row * spec.stepY, rx = OMR_RANGE_COL_X[col];
        const paperLum = Math.max(75, (sampleLum_(rx - 14, cy, 3) + sampleLum_(OMR_COL_X[col][0] + 24, cy, 4)) / 2);
        rangeSamples.push({ n: it.n, rx: rx, cy: cy, sc: measureDark_(rx, cy, rangeRad, paperLum) });
      }
      const rSorted = rangeSamples.map(function(x) { return x.sc; }).sort(function(a, b) { return a - b; });
      const rBase = rSorted.length ? rSorted[Math.floor(rSorted.length * 0.25)] : 0;
      const rangeChecked = rangeSamples.filter(function(s) { return (s.sc - rBase) >= 0.22 && s.sc >= 0.30; });
      rangeMarked = rangeChecked.length >= 1;
      ranges = rangeMarked
        ? buildRangesFromCheckedNos_(rangeChecked.map(function(r) { return r.n; }), fromNo, toNo)
        : [[fromNo, toNo]];
      effFromNo = ranges[0][0];
      effToNo = ranges[ranges.length - 1][1];
      if (rangeMarked) {
        const bh = spec.is70 ? 7.5 : (spec.is50 ? 9 : 11);
        rangeChecked.forEach(function(rc) { pCtx.strokeStyle = "#7c3aed"; pCtx.lineWidth = 3.5; pCtx.strokeRect(rc.rx - bh, rc.cy - bh, bh * 2, bh * 2); });
      }
      const innerRad = spec.radius * 0.72;
    for (let idx = 0; idx < totalSlots; idx++) {
      const it = rangeItems[idx], col = idx < spec.perCol ? 0 : 1, row = idx % spec.perCol;
      const cy = spec.startY + row * spec.stepY;
      if (!isInRanges_(it.n, ranges)) {
        pCtx.fillStyle = "rgba(148,163,184,0.28)";
        pCtx.fillRect(col === 0 ? 72 : 416, cy - spec.stepY / 2 + 2, 314, spec.stepY - 4);
        continue;
      }
      const isSubj = it.t === "subj";
      if (isSubj) {
        const px = OMR_COL_X[col][0] - 16;
        const pw = (OMR_COL_X[col][4] + 22) - px;
        const ph = Math.max(18, Math.round(spec.stepY - 8));
        const py = Math.round(cy - ph / 2);
        const sx = col === 0 ? 138 : 492;
        const sw = col === 0 ? 250 : Math.min(OMR_W - sx, 278);
        const halfH = Math.floor(spec.stepY * 0.49);
        const sy = Math.max(0, Math.round(cy - halfH));
        const sh = Math.min(OMR_H - sy, halfH * 2);
        subjCrops[String(it.n)] = cropSubjStrip_(sx, sy, sw, sh, 1.6);
        subjPendingNos.push(it.n);
        pCtx.save();
        pCtx.strokeStyle = "#6366f1";
        pCtx.lineWidth = 2.5;
        pCtx.setLineDash([6, 4]);
        pCtx.strokeRect(px + 1, py + 1, pw - 2, ph - 2);
        pCtx.fillStyle = "rgba(99,102,241,0.07)";
        pCtx.fillRect(px + 1, py + 1, pw - 2, ph - 2);
        pCtx.setLineDash([]);
        pCtx.fillStyle = "#4f46e5";
        pCtx.font = "800 10.5px sans-serif";
        pCtx.textAlign = "right";
        pCtx.fillText("✍️단답", px + pw - 5, py + 12);
        pCtx.restore();
        continue;
      }
      const optCnt = 5;
      const paperLum = Math.max(75, (sampleLum_(OMR_COL_X[col][0] + 24, cy, 4) + sampleLum_(OMR_COL_X[col][2] + 24, cy, 4)) / 2);
      const scores = [];
      for (let b = 0; b < optCnt; b++) scores.push({ b: b, bx: OMR_COL_X[col][b], sc: measureDark_(OMR_COL_X[col][b], cy, innerRad, paperLum) });
      const sorted = scores.slice().sort(function(a, b) { return a.sc - b.sc; });
      const baseSc = (sorted[0].sc + sorted[1].sc) / 2;
      const marked = [];
      scores.forEach(function(s) { const dl = s.sc - baseSc; if (dl >= 0.165 || s.sc >= 0.42) marked.push({ b: s.b, bx: s.bx, dl: dl, sc: s.sc }); });
      marked.sort(function(a, b) { return b.dl - a.dl; });

      let val = "", isWarn = false;
      if (marked.length > 0) {
        if (it.t === "multi") { val = marked.map(function(m) { return String(m.b + 1); }).sort().join(","); }
        else {
          if (marked.length >= 2 && marked[1].dl > marked[0].dl * 0.68 && marked[1].dl > 0.22) { val = marked.slice(0, 2).map(function(m) { return String(m.b + 1); }).sort().join(","); isWarn = true; }
          else val = String(marked[0].b + 1);
        }
      }
      if (val) answers[String(it.n)] = val;
      if (isWarn) warnCount++;

      const corNorm = normAns_(it.a, it.t);
      const isOk = val ? (val === corNorm) : false;
      pCtx.lineWidth = 3.5;
      if (val) marked.forEach(function(mk) { pCtx.beginPath(); pCtx.arc(mk.bx, cy, spec.radius + 3, 0, Math.PI * 2); pCtx.strokeStyle = isWarn ? "#f59e0b" : (isOk ? "#10b981" : "#ef4444"); pCtx.stroke(); });
      if (!isOk && corNorm) {
        corNorm.split(",").forEach(function(cd) {
          const ci = Number(cd) - 1;
          if (ci >= 0 && ci < 5) { pCtx.beginPath(); pCtx.arc(OMR_COL_X[col][ci], cy, spec.radius - 2, 0, Math.PI * 2); pCtx.strokeStyle = "#2563eb"; pCtx.lineWidth = 2.5; pCtx.stroke(); }
        });
      }
    }
    } // end else (V1 legacy)

    const thumb = document.createElement("canvas");
    thumb.width = 400; thumb.height = 560;
    thumb.getContext("2d").drawImage(prevCv, 0, 0, 400, 560);
    return {
      qrFound: qrFound,
      isBlankCard: Boolean(qrMeta && qrMeta.isBlankCard),
      isWrongRetest: isWrongRetest,
      wrongSetId: wrongSetId,
      missingWrongSet: missingWrongSet,
      isPrepExam: isPrepExam,
      prepSetId: prepSetId,
      missingPrepSet: missingPrepSet,
      warpedCanvasRef: (missingWrongSet || missingPrepSet) ? warpedCanvas : null,
      qrMetaRef: (missingWrongSet || missingPrepSet) ? qrMeta : null,
      erpId: erpId, secKey: secKey,
      fromNo: effFromNo, toNo: effToNo, ranges: ranges, rangeMarked: rangeMarked,
      answers: answers, subjCrops: subjCrops, subjPendingNos: subjPendingNos,
      warnCount: warnCount, previewUrl: thumb.toDataURL("image/jpeg", 0.78)
    };
  }

  // ===== Camera Control (100% Native Top-Level HTTPS, Zero Iframe!) =====
  window.stopCam_ = function() {
    S.camRunning = false;
    S.torchOn = false;
    if (RAF) { cancelAnimationFrame(RAF); RAF = null; }
    if (STREAM) { try { STREAM.getTracks().forEach(function(t) { t.stop(); }); } catch (_) {} STREAM = null; }
    const v = document.getElementById("camVid");
    if (v) v.srcObject = null;
    const cov = document.getElementById("camCover");
    const bar = document.getElementById("camLiveBar");
    if (cov) cov.classList.remove("hidden");
    if (bar) bar.classList.remove("show");
    const pill = document.getElementById("camPill");
    if (pill) { pill.className = "cam-pill"; pill.textContent = "카메라 대기 중"; }
  };

  function applyMirrorUi_() {
    const vid = document.getElementById("camVid");
    const ov = document.getElementById("camOv");
    const btn = document.getElementById("btnMirror");
    if (vid) vid.classList.toggle("mirror", Boolean(S.mirrorPreview));
    if (ov) ov.classList.toggle("mirror", Boolean(S.mirrorPreview));
    if (btn) {
      btn.classList.toggle("active-opt", Boolean(S.mirrorPreview));
      btn.textContent = S.mirrorPreview ? "🪞 거울화면 ON" : "🪞 거울화면 OFF";
    }
  }

  async function refreshCamDevices_() {
    if (!navigator.mediaDevices || typeof navigator.mediaDevices.enumerateDevices !== "function") return;
    try {
      const all = await navigator.mediaDevices.enumerateDevices();
      S.camDevices = all.filter(function(d) { return d.kind === "videoinput"; });
      const sel = document.getElementById("camDeviceSel");
      if (sel) {
        let curId = S.camDeviceId;
        if (!curId && STREAM) {
          try {
            const tr = STREAM.getVideoTracks()[0];
            const st = tr && tr.getSettings ? tr.getSettings() : {};
            if (st && st.deviceId) curId = st.deviceId;
          } catch (_) {}
        }
        sel.innerHTML = '<option value="">' + (IS_DESKTOP_DEV ? '기본 노트북·웹캠 자동' : '기본 카메라 (후면/전면)') + '</option>' +
          S.camDevices.map(function(d, idx) {
            const lbl = d.label || ("카메라 " + (idx + 1));
            return '<option value="' + esc_(d.deviceId) + '"' + (curId && d.deviceId === curId ? ' selected' : '') + '>' + esc_(lbl) + '</option>';
          }).join("");
      }
    } catch (_) {}
  }

  window.onChangeCamDevice_ = function(devId) {
    S.camDeviceId = String(devId || "");
    if (S.camRunning) startCam_();
  };

  window.toggleMirror_ = function() {
    S.mirrorPreview = !S.mirrorPreview;
    applyMirrorUi_();
  };

  window.startCam_ = async function() {
    stopCam_();
    const pill = document.getElementById("camPill");
    if (pill) { pill.className = "cam-pill warn"; pill.textContent = "⏳ 카메라 연결 중..."; }

    // 노트북/PC 웹캠은 16:9 1080p/720p 우선 (facingMode 강제 금지), 폰/태블릿은 후면 우선
    const attempts = [];
    if (S.camDeviceId) {
      attempts.push({ audio: false, video: { deviceId: { exact: S.camDeviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      attempts.push({ audio: false, video: { deviceId: { exact: S.camDeviceId }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      attempts.push({ audio: false, video: { deviceId: { exact: S.camDeviceId } } });
    } else if (IS_DESKTOP_DEV) {
      attempts.push({ audio: false, video: { width: { ideal: 1920 }, height: { ideal: 1080 } } });
      attempts.push({ audio: false, video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
    } else {
      attempts.push({ audio: false, video: { facingMode: { ideal: S.camFacing }, width: { ideal: 1280 }, height: { ideal: 960 } } });
    }
    attempts.push({ audio: false, video: true });

    let lastErr = null;
    for (let ai = 0; ai < attempts.length; ai++) {
      try {
        STREAM = await navigator.mediaDevices.getUserMedia(attempts[ai]);
        if (STREAM) break;
      } catch (err) {
        lastErr = err;
      }
    }
    if (!STREAM) {
      const msg = "카메라를 열 수 없습니다(" + ((lastErr && (lastErr.name || lastErr.message)) || lastErr) + "). 브라우저 주소창 왼쪽 카메라 권한 허용 또는 다른 프로그램(Zoom 등) 사용 여부를 확인해주세요.";
      if (pill) { pill.className = "cam-pill err"; pill.textContent = "⚠️ 카메라 권한/연결 확인 필요"; }
      showTopToast_(msg, "warn");
      return;
    }

    const vid = document.getElementById("camVid");
    if (!vid) { stopCam_(); return; }
    vid.muted = true;
    vid.playsInline = true;
    vid.setAttribute("playsinline", "");
    vid.setAttribute("webkit-playsinline", "");
    vid.srcObject = STREAM;
    try { await vid.play(); } catch (e) { stopCam_(); showTopToast_("비디오 재생 오류: " + e.message, "warn"); return; }

    S.camRunning = true;
    STABLE_CORNERS = null; STABLE_CNT = 0; NO_CORNER_FRAMES = 0;
    const cov = document.getElementById("camCover");
    const bar = document.getElementById("camLiveBar");
    if (cov) cov.classList.add("hidden");
    if (bar) bar.classList.add("show");
    applyMirrorUi_();
    refreshCamDevices_();
    if (pill) {
      pill.className = "cam-pill ok";
      pill.textContent = IS_DESKTOP_DEV
        ? "💻 노트북 카메라 ON · OMR 4코너를 비추거나 Space 키로 즉시 판독"
        : "📷 실시간 스캔 ON · OMR 4코너를 비춰주세요";
    }

    // Check torch capability
    const torchBtn = document.getElementById("btnTorch");
    if (torchBtn) {
      try {
        const track = STREAM.getVideoTracks()[0];
        const caps = track && track.getCapabilities ? track.getCapabilities() : {};
        torchBtn.style.display = caps.torch ? "" : "none";
      } catch (_) { torchBtn.style.display = "none"; }
    }

    const workCv = document.createElement("canvas");
    const fullCv = document.createElement("canvas");
    const loop_ = function(ts) {
      if (!S.camRunning) return;
      RAF = requestAnimationFrame(loop_);
      if (ts - LAST_TICK < 130) return;
      LAST_TICK = ts;
      const vw = vid.videoWidth, vh = vid.videoHeight;
      if (!vw || !vh) return;
      const ov = document.getElementById("camOv");
      const pEl = document.getElementById("camPill");
      if (ov && (ov.width !== vw || ov.height !== vh)) { ov.width = vw; ov.height = vh; }
      const targetW = IS_DESKTOP_DEV ? 600 : 540, scale = targetW / vw, targetH = Math.round(vh * scale);
      if (workCv.width !== targetW || workCv.height !== targetH) { workCv.width = targetW; workCv.height = targetH; }
      const wCtx = workCv.getContext("2d", { willReadFrequently: true });
      wCtx.drawImage(vid, 0, 0, targetW, targetH);
      const diag = { squares: [] };
      const quadSmall = detectFourCornerMarkers_(wCtx.getImageData(0, 0, targetW, targetH), targetW, targetH, diag);

      if (ov) {
        const oCtx = ov.getContext("2d");
        oCtx.clearRect(0, 0, ov.width, ov.height);
        if (quadSmall) {
          const qf = quadSmall.map(function(p) { return { x: p.x / scale, y: p.y / scale }; });
          oCtx.strokeStyle = STABLE_CNT >= 1 ? "#10b981" : "#facc15";
          oCtx.lineWidth = Math.max(4, vw * 0.005);
          oCtx.beginPath();
          oCtx.moveTo(qf[0].x, qf[0].y); oCtx.lineTo(qf[1].x, qf[1].y);
          oCtx.lineTo(qf[3].x, qf[3].y); oCtx.lineTo(qf[2].x, qf[2].y);
          oCtx.closePath(); oCtx.stroke();
          qf.forEach(function(p) { oCtx.fillStyle = "#10b981"; oCtx.beginPath(); oCtx.arc(p.x, p.y, Math.max(8, vw * 0.01), 0, Math.PI * 2); oCtx.fill(); });

          NO_CORNER_FRAMES = 0;
          if (STABLE_CORNERS) {
            let maxM = 0;
            for (let i = 0; i < 4; i++) maxM = Math.max(maxM, Math.hypot(qf[i].x - STABLE_CORNERS[i].x, qf[i].y - STABLE_CORNERS[i].y));
            if (maxM < vw * 0.068) STABLE_CNT++; else STABLE_CNT = 0;
          }
          STABLE_CORNERS = qf;
          if (pEl) {
            pEl.className = "cam-pill " + (STABLE_CNT >= 1 ? "ok" : "warn");
            pEl.textContent = STABLE_CNT >= 1 ? "✓ OMR 4코너 인식! 다음 답안지를 넘겨주세요" : "🎯 4코너 마커 고정 중...";
          }
          if (STABLE_CNT === 1 || (STABLE_CNT > 1 && STABLE_CNT % 4 === 0)) {
            fullCv.width = vw; fullCv.height = vh;
            fullCv.getContext("2d").drawImage(vid, 0, 0, vw, vh);
            const warped = warpAndOrientOmrCanvas_(fullCv, qf);
            if (warped) {
              const parsed = readWarpedOmrCanvas_(warped);
              // 실시간 카메라에서 오토포커스 전 흐린 프레임으로 QR 미인식 오채점 방지!
              if (!parsed.qrFound && !S.allowBlankQr) {
                if (pEl) {
                  pEl.className = "cam-pill warn";
                  pEl.textContent = "🎯 4코너 고정됨 · 우상단 QR 초점 맞추는 중... (조금 가까이 유지)";
                }
                STABLE_CNT = 2; // 다음 4프레임마다 QR 재시도
              } else {
                const ansCnt = Object.keys(parsed.answers || {}).length;
                const rngSig = formatRanges_(parsed.ranges);
                const sig = parsed.erpId + "|" + parsed.secKey + "|" + rngSig + "|" + JSON.stringify(parsed.answers);
                const nowMs = Date.now();
                if (sig !== LAST_SIG && (nowMs - LAST_SIG_AT) > 700) {
                  LAST_SIG = sig; LAST_SIG_AT = nowMs;
                  onOmrParsed_(parsed, "직통실시간OMR");
                  if (ansCnt === 0 && !parsed.qrFound) { STABLE_CNT = 0; LAST_SIG = ""; }
                }
              }
            }
          }
        } else {
          (diag.squares || []).slice(0, 8).forEach(function(sq) {
            oCtx.strokeStyle = "rgba(250, 204, 21, 0.85)";
            oCtx.lineWidth = Math.max(2.5, vw * 0.003);
            oCtx.beginPath(); oCtx.arc(sq.x / scale, sq.y / scale, Math.max(7, (sq.size / scale) * 0.65), 0, Math.PI * 2); oCtx.stroke();
          });
          NO_CORNER_FRAMES++; STABLE_CNT = 0; STABLE_CORNERS = null;
          if (NO_CORNER_FRAMES >= 3) LAST_SIG = "";
          if (pEl) {
            pEl.className = "cam-pill";
            const cnt = (diag.squares || []).length;
            pEl.textContent = cnt > 0 ? ("🔍 네모 마커 후보 " + Math.min(4, cnt) + "개 보임 · 네 모서리를 맞춰주세요") : "📄 OMR 네 모서리 검은 사각형을 화면 안에 맞춰주세요";
          }
        }
      }
    };
    RAF = requestAnimationFrame(loop_);
  };

  window.flipCam_ = function() {
    // 노트북/PC에서 카메라가 2개 이상(내장 웹캠 + 외장 USB/연속성 카메라)이면 순환 전환!
    if (IS_DESKTOP_DEV && S.camDevices.length >= 2) {
      let curId = S.camDeviceId;
      if (!curId && STREAM) {
        try { const st = STREAM.getVideoTracks()[0].getSettings(); if (st && st.deviceId) curId = st.deviceId; } catch (_) {}
      }
      const idx = S.camDevices.findIndex(function(d) { return d.deviceId === curId; });
      const nextDev = S.camDevices[(idx + 1) % S.camDevices.length];
      S.camDeviceId = nextDev.deviceId;
      showTopToast_("카메라 전환: " + (nextDev.label || "다음 카메라"), "info");
      if (S.camRunning) startCam_();
      return;
    }
    S.camDeviceId = "";
    S.camFacing = S.camFacing === "user" ? "environment" : "user";
    S.mirrorPreview = (S.camFacing === "user");
    if (S.camRunning) startCam_();
  };

  // 노트북 키보드 단축키: 카메라 ON 상태에서 Space 키로 즉시 판독!
  document.addEventListener("keydown", function(e) {
    if (!S.camRunning) return;
    if (e.code === "Space" || e.key === " ") {
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toUpperCase() : "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") return;
      e.preventDefault();
      snapLiveNow_();
    }
  });

  window.toggleTorch_ = async function() {
    if (!STREAM) return;
    try {
      const track = STREAM.getVideoTracks()[0];
      S.torchOn = !S.torchOn;
      await track.applyConstraints({ advanced: [{ torch: S.torchOn }] });
      const btn = document.getElementById("btnTorch");
      if (btn) btn.classList.toggle("torch-on", S.torchOn);
    } catch (_) {
      showTopToast_("이 기기는 웹 손전등 제어를 지원하지 않습니다.", "warn");
    }

  window.snapLiveNow_ = function() {
    const vid = document.getElementById("camVid");
    if (!S.camRunning || !vid || !vid.videoWidth) { showTopToast_("먼저 카메라를 켜주세요.", "warn"); return; }
    const vw = vid.videoWidth, vh = vid.videoHeight;
    const fullCv = document.createElement("canvas");
    fullCv.width = vw; fullCv.height = vh;
    fullCv.getContext("2d").drawImage(vid, 0, 0, vw, vh);
    let quadFull = null;
    [640, 900].forEach(function(tw) {
      if (quadFull) return;
      const sc = Math.min(1, tw / Math.max(vw, vh)), ww = Math.round(vw * sc), wh = Math.round(vh * sc);
      const wc = document.createElement("canvas"); wc.width = ww; wc.height = wh;
      const wCtx = wc.getContext("2d", { willReadFrequently: true }); wCtx.drawImage(fullCv, 0, 0, ww, wh);
      const q = detectFourCornerMarkers_(wCtx.getImageData(0, 0, ww, wh), ww, wh);
      if (q) quadFull = q.map(function(p) { return { x: p.x / sc, y: p.y / sc }; });
    });
    if (!quadFull) { beep_("warn"); showTopToast_("네 모서리 검은 사각형 4개를 찾지 못했습니다. 살짝 뒤로 비춰주세요.", "warn"); return; }
    const warped = warpAndOrientOmrCanvas_(fullCv, quadFull);
    if (!warped) return;
    LAST_SIG = "";
    onOmrParsed_(readWarpedOmrCanvas_(warped), "직통실시간OMR");
  };

  window.handleFiles_ = async function(fileList, inpEl) {
    const files = Array.prototype.slice.call(fileList || []);
    if (inpEl) setTimeout(function() { try { inpEl.value = ""; } catch (_) {} }, 120);
    if (!files.length) return;
    showTopToast_("OMR 사진 " + files.length + "장 판독 중...", "info");
    let ok = 0, fail = 0;
    const procOne_ = function(cv) {
      let qf = null;
      [640, 900].forEach(function(tw) {
        if (qf) return;
        const sc = Math.min(1, tw / Math.max(cv.width, cv.height)), ww = Math.round(cv.width * sc), wh = Math.round(cv.height * sc);
        const wc = document.createElement("canvas"); wc.width = ww; wc.height = wh;
        const wCtx = wc.getContext("2d", { willReadFrequently: true }); wCtx.drawImage(cv, 0, 0, ww, wh);
        const q = detectFourCornerMarkers_(wCtx.getImageData(0, 0, ww, wh), ww, wh);
        if (q) qf = q.map(function(p) { return { x: p.x / sc, y: p.y / sc }; });
      });
      if (!qf) return false;
      const w = warpAndOrientOmrCanvas_(cv, qf);
      if (!w) return false;
      onOmrParsed_(readWarpedOmrCanvas_(w), "직통사진OMR");
      ok++; return true;
    };
    for (let i = 0; i < files.length; i++) {
      try {
        const im = await new Promise(function(res, rej) {
          const img = new Image();
          let triedReader = false;
          const loadViaReader = function() {
            triedReader = true;
            const fr = new FileReader();
            fr.onload = function() { img.src = fr.result; };
            fr.onerror = function() { rej(new Error("read")); };
            fr.readAsDataURL(files[i]);
          };
          let u = "";
          try { u = URL.createObjectURL(files[i]); } catch (_) {}
          img.onload = function() { if (u) { try { URL.revokeObjectURL(u); } catch (_) {} } res(img); };
          img.onerror = function() {
            if (u) { try { URL.revokeObjectURL(u); } catch (_) {} u = ""; }
            if (!triedReader) loadViaReader(); else rej(new Error("load"));
          };
          if (u) img.src = u; else loadViaReader();
        });
        const cv = document.createElement("canvas");
        const sc = Math.min(1, 1800 / Math.max(im.naturalWidth || im.width, im.naturalHeight || im.height));
        cv.width = Math.round((im.naturalWidth || im.width) * sc);
        cv.height = Math.round((im.naturalHeight || im.height) * sc);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        if (!procOne_(cv)) {
          let hOk = 0;
          if (cv.width > cv.height * 1.15) {
            const hw = Math.floor(cv.width / 2);
            for (let h = 0; h < 2; h++) {
              const hc = document.createElement("canvas"); hc.width = hw; hc.height = cv.height;
              hc.getContext("2d").drawImage(cv, h * hw, 0, hw, cv.height, 0, 0, hw, cv.height);
              if (procOne_(hc)) hOk++;
            }
          }
          if (!hOk) fail++;
        }
      } catch (_) { fail++; }
    }
    showTopToast_("판독 완료: 성공 " + ok + "건" + (fail ? " · 미인식 " + fail + "건" : ""), ok ? "ok" : "warn");
  };

  async function onOmrParsed_(parsed, method) {
    // 방금 인쇄한 오답 세트가 로컬 캐시에 없을 경우 서버에서 온디맨드 자동 조회 후 즉시 채점!
    if (parsed.missingWrongSet && parsed.wrongSetId && parsed.warpedCanvasRef && !parsed._retriedWrongSet) {
      showTopToast_("🎯 오답 재채점 세트(" + parsed.wrongSetId + ") 조회 중...", "info");
      try {
        const u = S.apiUrl + (S.apiUrl.indexOf("?") >= 0 ? "&" : "?") + "api=naesinOmrWrongSet&tok=" + encodeURIComponent(S.tok) + "&setId=" + encodeURIComponent(parsed.wrongSetId) + "&seasonCode=" + encodeURIComponent(S.seasonCode);
        const resp = await fetch(u, { redirect: "follow" });
        const r = await resp.json();
        if (r && r.success && r.set && r.set.id) {
          S.wrongSets[r.set.id] = r.set;
          const re = readWarpedOmrCanvas_({ canvas: parsed.warpedCanvasRef, qrMeta: parsed.qrMetaRef });
          re._retriedWrongSet = true;
          onOmrParsed_(re, method);
          return;
        }
      } catch (_) {}
      showTopToast_("오답 재채점 세트(" + parsed.wrongSetId + ")를 찾지 못했습니다.", "warn");
      return;
    }

    // 방금 인쇄한 기출·예상 시험지가 로컬 캐시에 없을 경우 서버에서 온디맨드 자동 조회 후 즉시 채점!
    if (parsed.missingPrepSet && parsed.prepSetId && parsed.warpedCanvasRef && !parsed._retriedPrepSet) {
      showTopToast_("🏫 기출·예상 시험지(" + parsed.prepSetId + ") 정답표 조회 중...", "info");
      try {
        const u = S.apiUrl + (S.apiUrl.indexOf("?") >= 0 ? "&" : "?") + "api=naesinOmrPrepExam&tok=" + encodeURIComponent(S.tok) + "&setId=" + encodeURIComponent(parsed.prepSetId);
        const resp = await fetch(u, { redirect: "follow" });
        const r = await resp.json();
        if (r && r.success && r.secKey && Array.isArray(r.items) && r.items.length) {
          S.itemsBySec[r.secKey] = r.items;
          S.prepSections = S.prepSections || [];
          const pSec = r.section || { key: r.secKey, step: "PREP", grp: "기출·예상", shortLbl: r.secKey, title: r.secKey, count: r.items.length };
          const pi = S.prepSections.findIndex(function(x) { return x && x.key === r.secKey; });
          if (pi >= 0) S.prepSections[pi] = pSec; else S.prepSections.unshift(pSec);
          const re = readWarpedOmrCanvas_({ canvas: parsed.warpedCanvasRef, qrMeta: parsed.qrMetaRef });
          re._retriedPrepSet = true;
          onOmrParsed_(re, method);
          return;
        }
      } catch (_) {}
      showTopToast_("기출·예상 시험지(" + parsed.prepSetId + ") 정답표를 찾지 못했습니다.", "warn");
      return;
    }

    const isWrongRetest = Boolean(parsed.isWrongRetest && parsed.wrongSetId);
    const qrMissing = !parsed.qrFound && !S.allowBlankQr;
    const isBlankCard = Boolean(parsed.isBlankCard);
    // 절대 QR 미인식 시 임의의 기본 학생으로 덮어쓰지 않음!
    const stu = qrMissing
      ? null
      : (parsed.erpId ? getStu_(parsed.erpId) : (S.allowBlankQr ? getStu_(S.selStudentId) : null));
    const meta = isWrongRetest
      ? { key: "WR:" + parsed.wrongSetId, shortLbl: "오답재채점", title: "🎯 오답 재채점 [" + parsed.wrongSetId + "]" }
      : getSecMeta_(parsed.secKey);
    const ranges = (Array.isArray(parsed.ranges) && parsed.ranges.length) ? parsed.ranges : [[parsed.fromNo, parsed.toNo]];
    const graded = isWrongRetest
      ? gradeWrongSetLocal_(parsed.wrongSetId, parsed.answers, ranges)
      : gradeLocal_(parsed.secKey, parsed.answers, ranges);
    const subjCrops = (parsed.subjCrops && typeof parsed.subjCrops === "object") ? parsed.subjCrops : {};
    const subjPendingNos = Array.isArray(parsed.subjPendingNos) ? parsed.subjPendingNos.slice() : [];
    const hasPendSubj = subjPendingNos.length > 0;
    const item = {
      id: "D_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 5),
      erpId: stu ? stu.erpId : "",
      name: stu ? stu.name : (qrMissing ? "⚠️ QR 미인식 (학생·교재 선택)" : (isBlankCard ? "공용 OMR (학생 선택)" : ("⚠️ 미등록 ID(" + parsed.erpId + ")"))),
      school: stu ? stu.school : "",
      naesinBan: stu ? stu.naesinBan : "",
      isWrongRetest: isWrongRetest,
      wrongSetId: isWrongRetest ? parsed.wrongSetId : "",
      secKey: parsed.secKey, secTitle: meta.title,
      fromNo: ranges[0][0], toNo: ranges[ranges.length - 1][1],
      ranges: ranges,
      rangeMarked: Boolean(parsed.rangeMarked),
      qrFound: Boolean(parsed.qrFound),
      qrMissing: qrMissing,
      answers: parsed.answers,
      subjCrops: subjCrops,
      subjPendingNos: subjPendingNos,
      ocrBusy: false,
      ocrMsg: hasPendSubj ? ("서술형 단답 " + subjPendingNos.length + "문항 확인 필요") : "",
      graded: graded,
      method: isWrongRetest ? "직통오답OMR재채점" : method, previewUrl: parsed.previewUrl || "",
      warnCount: parsed.warnCount || 0, saved: false, saving: false,
      savedKey: null
    };
    const exIdx = S.queue.findIndex(function(q) {
      return !q.saved && q.erpId === item.erpId && q.secKey === item.secKey && formatRanges_(q.ranges) === formatRanges_(item.ranges);
    });
    if (exIdx >= 0) S.queue[exIdx] = item; else S.queue.unshift(item);
    S.activeId = item.id;
    beep_((qrMissing || !stu || item.warnCount) ? "warn" : "ok");

    const bn = document.getElementById("camBanner");
    if (bn) {
      if (qrMissing || !stu) {
        bn.style.background = "rgba(217, 119, 6, 0.94)";
        bn.innerHTML = '<span>⚠️ QR 미인식 · 자동저장 차단됨! 오른쪽에서 학생·교재 선택 후 저장하세요</span><span style="font-size:11px;">재스캔 가능</span>';
      } else if (hasPendSubj) {
        bn.style.background = "rgba(79, 70, 229, 0.95)";
        bn.innerHTML = '<span>✍️ ' + esc_(item.name) + ' · 객관식 ' + graded.correct + '/' + graded.solved + ' + 서술형 ' + subjPendingNos.length + '문항 필기 보관함 전송!</span><span style="font-size:11px;">포털 하이드로젠 채점 대기</span>';
      } else if (isWrongRetest) {
        bn.style.background = "rgba(109, 40, 217, 0.95)";
        bn.innerHTML = '<span>🎯 ' + esc_(item.name) + ' 오답 재채점 (' + esc_(formatRanges_(ranges)) + '번) · <strong>해결 ' + graded.correct + '/' + graded.solved + ' (' + graded.acc + '%)</strong></span><span style="font-size:11px; opacity:0.9;">오답해결 자동반영</span>';
      } else {
        bn.style.background = "rgba(5, 150, 105, 0.94)";
        bn.innerHTML = '<span>✓ ' + esc_(item.name) + ' · ' + esc_(meta.shortLbl) + ' (' + esc_(formatRanges_(ranges)) + '번) · <strong>' + graded.correct + '/' + graded.solved + ' (' + graded.acc + '%)</strong>' + (item.rangeMarked ? ' [구간체크]' : '') + '</span><span style="font-size:11px; opacity:0.9;">다음 종이를 비추세요</span>';
      }
      bn.classList.add("show");
      clearTimeout(bn._tm);
      bn._tm = setTimeout(function() { bn.classList.remove("show"); }, (qrMissing || !stu || hasPendSubj) ? 4000 : 2800);
    }
    renderRight_();
    // QR 정상 학생이면 객관식 채점 + 서술형 필기 이미지를 즉시 서버 보관함으로 자동 저장 (포털에서 하이드로젠 백그라운드 일괄 채점!)
    if (S.autoSave && !qrMissing && !isBlankCard && stu && (graded.solved > 0 || hasPendSubj)) saveItem_(item.id, true);
  }

  async function postApi_(payload) {
    const resp = await fetch(S.apiUrl, {
      method: "POST",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
    return await resp.json();
  }

  window.saveItem_ = async function(id, silent) {
    const item = S.queue.find(function(x) { return x.id === id; });
    if (!item) return;
    const stu = getStu_(item.erpId);
    if (!stu) { showTopToast_("학생을 먼저 선택해주세요.", "warn"); return; }
    const ranges = (Array.isArray(item.ranges) && item.ranges.length) ? item.ranges : [[item.fromNo, item.toNo]];
    const scopedCrops = {};
    Object.keys(item.subjCrops || {}).forEach(function(k) {
      const n = Number(k);
      if (Number.isFinite(n) && isInRanges_(n, ranges) && item.subjCrops[k]) scopedCrops[String(n)] = item.subjCrops[k];
    });
    const hasScopedCrops = Object.keys(scopedCrops).length > 0;
    const preG = item.isWrongRetest ? gradeWrongSetLocal_(item.wrongSetId, item.answers, ranges) : gradeLocal_(item.secKey, item.answers, ranges);
    if (!silent && preG.ungradedSubj > 0 && preG.solved > 0 && !hasScopedCrops) {
      const okX = window.confirm(
        "⚠️ 서술형 " + preG.ungradedSubjNos.join(", ") + "번(" + preG.ungradedSubj + "문항)이 아직 채점되지 않았습니다!\n"
        + "• [확인] → 미채점 서술형을 오답(X)으로 포함해 " + (preG.solved + preG.ungradedSubj) + "문항 전체로 저장\n"
        + "• [취소] → 저장 중단 후 서술형 먼저 채점"
      );
      if (!okX) return;
      preG.ungradedSubjNos.forEach(function(sn) { item.answers[String(sn)] = "X"; });
      item.subjPendingNos = [];
    }

    // 🎯 오답노트 재채점 OMR 저장 경로
    if (item.isWrongRetest && item.wrongSetId) {
      item.saving = true;
      renderRight_();
      try {
        const res = await postApi_({
          api: "naesinOmrSaveWrongRetest", tok: S.tok, seasonCode: S.seasonCode, teacher: S.teacher,
          setId: item.wrongSetId, erpId: stu.erpId, name: stu.name, school: stu.school, naesinBan: stu.naesinBan,
          slotAnswers: filterAnsToRanges_(item.answers, ranges), ranges: ranges, method: item.method || "직통오답OMR재채점"
        });
        item.saving = false;
        if (res && res.success) {
          item.saved = true; item.qrMissing = false;
          if (!silent) showTopToast_(res.message || ("🎯 " + stu.name + " 오답 재채점 반영 완료!"), "ok");
        } else { showTopToast_("재채점 저장 실패: " + ((res && res.message) || "오류"), "warn"); }
      } catch (err) {
        item.saving = false;
        showTopToast_("네트워크 오류: " + (err.message || err), "warn");
      }
      renderRight_();
      return;
    }

    const newKey = stu.erpId + "|" + item.secKey;
    // 이미 다른 학생·교재로 잘못 저장했던 항목을 수정 저장하는 경우 기존 잘못된 기록 자동 삭제 확인
    if (item.savedKey && item.savedKey !== newKey && !silent) {
      const oldParts = item.savedKey.split("|");
      const oldStu = getStu_(oldParts[0]);
      const oldSec = getSecMeta_(oldParts[1]);
      if (window.confirm("기존에 저장되었던 [" + (oldStu ? oldStu.name : oldParts[0]) + " · " + oldSec.shortLbl + "] 기록은 삭제하고 [" + stu.name + " · " + item.secTitle + "]로 옮겨 저장할까요?")) {
        try {
          await postApi_({ api: "naesinOmrDelete", tok: S.tok, seasonCode: S.seasonCode, erpId: oldParts[0], secKey: oldParts[1], clearProgress: true });
        } catch (_) {}
      }
    }
    item.saving = true;
    renderRight_();
    try {
      const scopedAns = filterAnsToRanges_(item.answers, ranges);
      const res = await postApi_({
        api: "naesinOmrSave", tok: S.tok, seasonCode: S.seasonCode, teacher: S.teacher,
        entries: [{
          erpId: stu.erpId, name: stu.name, school: stu.school, naesinBan: stu.naesinBan,
          secKey: item.secKey, answers: scopedAns,
          subjCrops: hasScopedCrops ? scopedCrops : undefined,
          subjQueueOnly: Boolean(preG.solved === 0 && hasScopedCrops),
          mergeMode: true, replaceRanges: ranges, method: item.method
        }]
      });
      item.saving = false;
      if (res && res.success) {
        item.saved = true;
        item.qrMissing = false;
        item.savedKey = newKey;
        if (!silent) showTopToast_("✓ " + (res.message || (stu.name + " · " + item.secTitle + " 저장 완료!")), "ok");
      } else {
        showTopToast_("저장 실패: " + ((res && res.message) || "오류"), "warn");
      }
    } catch (err) {
      item.saving = false;
      showTopToast_("네트워크 저장 오류: " + (err.message || err), "warn");
    }
    renderRight_();
  };

  window.deleteItem_ = async function(id) {
    const item = S.queue.find(function(x) { return x.id === id; });

  window.toggleAns_ = function(id, n, opt, qt) {
    const q = S.queue.find(function(x) { return x.id === id; }); if (!q) return;
    const k = String(n), cur = q.answers[k] || "";
    if (opt === "X") { if (cur === "X") delete q.answers[k]; else q.answers[k] = "X"; }
    else if (qt === "multi") {
      const a = (cur && cur !== "X") ? cur.split(",") : [], idx = a.indexOf(opt);
      if (idx >= 0) a.splice(idx, 1); else a.push(opt);
      a.sort(); if (a.length) q.answers[k] = a.join(","); else delete q.answers[k];
    } else { if (cur === opt) delete q.answers[k]; else q.answers[k] = opt; }

  let TESS_WORKER_ = null;
  async function ensureTesseractWorker_() {
    if (TESS_WORKER_) return TESS_WORKER_;
    if (!window.Tesseract) {
      await new Promise(function(res, rej) {
        const sc = document.createElement("script");
        sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
        sc.onload = res; sc.onerror = rej;
        document.head.appendChild(sc);
      });
    }
    TESS_WORKER_ = await window.Tesseract.createWorker("eng");
    await TESS_WORKER_.setParameters({ tessedit_char_whitelist: "0123456789/.-=xyab:,()", tessedit_pageseg_mode: "7" });
    return TESS_WORKER_;
  }
  function prepCropForOcr_(dataUrl) {
    return new Promise(function(resolve) {
      const im = new Image();
      im.onload = function() {
        const cv = document.createElement("canvas");
        cv.width = im.width; cv.height = im.height;
        const ctx = cv.getContext("2d", { willReadFrequently: true });
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.drawImage(im, 0, 0);
        try {
          const id = ctx.getImageData(0, 0, cv.width, cv.height);
          const d = id.data;
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const lum = (r * 77 + g * 150 + b * 29) >> 8;
            // 컬러 인쇄 구형 OMR의 연보라(#6366f1) 인쇄선은 OCR 시 흰색으로 억제
            const isPrintedIndigo = (b - r > 32 && b - g > 20 && lum > 85);
            const v = (isPrintedIndigo || lum > 168) ? 255 : 0;
            d[i] = d[i + 1] = d[i + 2] = v;
          }
          ctx.putImageData(id, 0, 0);
        } catch (_) {}
        resolve(cv.toDataURL("image/png"));
      };
      im.onerror = function() { resolve(dataUrl); };
      im.src = dataUrl;
    });
  }
  window.runSubjOcr_ = async function(id) {
    const q = S.queue.find(function(x) { return x.id === id; }); if (!q || q.ocrBusy) return;
    const rgs = (Array.isArray(q.ranges) && q.ranges.length) ? q.ranges : [[q.fromNo, q.toNo]];
    const items = (q.isWrongRetest ? getWrongSetVirtualItems_(q.wrongSetId) : (S.itemsBySec[q.secKey] || []))
      .filter(function(it) { return it.t === "subj" && isInRanges_(it.n, rgs) && q.subjCrops && q.subjCrops[String(it.n)]; });
    if (!items.length) { showTopToast_("인식할 서술형 필기 이미지가 없습니다.", "warn"); return; }
    q.ocrBusy = true;
    q.ocrMsg = "🔍 오프라인 숫자·분수 OCR 엔진 로드 중...";
    renderRight_();
    try {
      const worker = await ensureTesseractWorker_();
      let hit = 0;
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        q.ocrMsg = "🔍 서술형 단답 판독 중 (" + (i + 1) + "/" + items.length + ")...";
        const stEl = document.getElementById("subjOcrTxt_" + q.id);
        if (stEl) stEl.textContent = q.ocrMsg;
        const pre = await prepCropForOcr_(q.subjCrops[String(it.n)]);
        const res = await worker.recognize(pre);
        const raw = String((res && res.data && res.data.text) || "").replace(/\s+/g, "").replace(/[^0-9/.\-=xyab:,()]/gi, "").trim();
        if (raw && /[0-9]/.test(raw)) {
          q.answers["t_" + it.n] = raw;
          q.answers[String(it.n)] = matchSubjShortAns_(raw, it.a || it.d || "") ? "O" : "X";
          hit++;
        }
      }
      q.subjPendingNos = [];
      q.ocrMsg = "✓ 숫자 OCR 완료 (" + hit + "/" + items.length + "문항 인식) — 필기 이미지를 보고 확인 후 저장하세요";
      q.saved = false;
      showTopToast_("✓ 서술형 숫자 OCR 완료 (" + hit + "문항)", "ok");
    } catch (e) {
      q.ocrMsg = "⚠️ OCR 로드 실패 — 아래 필기 이미지를 보고 단답을 직접 입력해 주세요.";
      showTopToast_("OCR 오류: " + (e.message || e), "warn");
    }
    q.ocrBusy = false;
    renderRight_();
  };
